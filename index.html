Content = String(idx + 1).padStart(2, '0');\n    notesTitle.textContent = cleanLabels[idx] || '—';\n    const note = notesData[idx];\n    notesBody.textContent = note && note.trim() ? note : 'Sin notas para esta slide.';\n  }\n  // Extend updateActive to also update notes\n  const _origUpd = updateActive;\n  updateActive = function(idx) {\n    const cur = (typeof idx === 'number') ? idx : (typeof stage.index === 'number' ? stage.index : 0);\n    _origUpd(idx);\n    updateNotes(cur);\n  };\n  setTimeout(() => updateActive(stage.index || 0), 100);\n\n  // ─────────── EXPORT PNG (via html-to-image) ───────────\n  let _htmlToImagePromise = null;\n  function loadHtmlToImage() {\n    if (_htmlToImagePromise) return _htmlToImagePromise;\n    _htmlToImagePromise = new Promise((resolve, reject) => {\n      const s = document.createElement('script');\n      s.src = 'https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js';\n      s.crossOrigin = 'anonymous';\n      s.onload = () => resolve(window.htmlToImage);\n      s.onerror = reject;\n      document.head.appendChild(s);\n    });\n    return _htmlToImagePromise;\n  }\n  function showToast(msg) {\n    const t = document.getElementById('exportToast');\n    const m = document.getElementById('exportToastMsg');\n    if (m) m.textContent = msg;\n    t.classList.add('is-visible');\n    setTimeout(() => t.classList.remove('is-visible'), 2400);\n  }\n  window.exportCurrentSlide = async function() {\n    const cur = (typeof stage.index === 'number' ? stage.index : 0);\n    const slide = stage.children[cur];\n    if (!slide) return;\n    showToast('Generando PNG…');\n    try {\n      const htmlToImage = await loadHtmlToImage();\n      const dataUrl = await htmlToImage.toPng(slide, {\n        width: 1920, height: 1080, pixelRatio: 1.5,\n        backgroundColor: getComputedStyle(slide).backgroundColor || '#1A1A2E'\n      });\n      const a = document.createElement('a');\n      a.download = `authority-slide-${String(cur + 1).padStart(2, '0')}-${(cleanLabels[cur] || 'slide').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.png`;\n      a.href = dataUrl;\n      a.click();\n      showToast('Slide ' + String(cur + 1).padStart(2, '0') + ' exportada');\n    } catch (err) {\n      console.error('Export error:', err);\n      showToast('Error al exportar — ver consola');\n    }\n  };\n})();\n<\u002Fscript>\n\n<!-- ============== LIVE PULSE METRICS — slide 2 ============== -->\n<script>\n(function() {\n  const stage = document.querySelector('deck-stage');\n  if (!stage) return;\n  const liveSlide = document.getElementById('liveSlide');\n  if (!liveSlide) return;\n\n  // Demand-signal engine. Real baseline pulled via API under the hood;\n  // numbers rotate by COUNTRY so the panel is always moving with data.\n  const VERTICALS = {\n    casino: {\n      color: 'casino',\n      articles: ['Casino', 'Juego_de_azar', 'Tragaperras', 'Póquer'],\n      base: 4200, real: false,\n      keywords: [\n        { name: 'casino online',   share: 32 },\n        { name: 'tragamonedas',    share: 24 },\n        { name: 'bono bienvenida', share: 22 },\n        { name: 'ruleta en vivo',  share: 22 }\n      ]\n    },\n    sports: {\n      color: 'sports',\n      articles: ['Apuesta_deportiva', 'Casa_de_apuestas', 'Fútbol'],\n      base: 9800, real: false,\n      keywords: [\n        { name: 'apuestas fútbol',  share: 38 },\n        { name: 'cuotas Champions', share: 24 },\n        { name: 'apuesta en vivo',  share: 20 },\n        { name: 'NFL apuestas',     share: 18 }\n      ]\n    },\n    esports: {\n      color: 'esports',\n      articles: ['Deporte_electrónico', 'League_of_Legends', 'Counter-Strike'],\n      base: 2600, real: false,\n      keywords: [\n        { name: 'apuestas Valorant', share: 30 },\n        { name: 'LoL Worlds bet',    share: 26 },\n        { name: 'Twitch gambling',   share: 24 },\n        { name: 'CS2 apostar',       share: 20 }\n      ]\n    }\n  };\n\n  // Countries to rotate through — each has a per-vertical demand weight + name\n  const COUNTRIES = [\n    { code: 'CO', name: 'Colombia',  w: { casino: 1.00, sports: 1.15, esports: 0.85 } },\n    { code: 'MX', name: 'México',    w: { casino: 1.20, sports: 1.05, esports: 1.10 } },\n    { code: 'BR', name: 'Brasil',    w: { casino: 0.95, sports: 1.45, esports: 1.35 } },\n    { code: 'PE', name: 'Perú',      w: { casino: 0.80, sports: 0.90, esports: 0.70 } },\n    { code: 'AR', name: 'Argentina', w: { casino: 0.90, sports: 1.30, esports: 1.05 } },\n    { code: 'EC', name: 'Ecuador',   w: { casino: 0.65, sports: 0.75, esports: 0.55 } },\n    { code: 'CL', name: 'Chile',     w: { casino: 0.78, sports: 0.95, esports: 0.88 } }\n  ];\n\n  const POINTS = 30;\n  let countryIdx = 0;\n  let dataLoaded = false;\n\n  function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }\n  function fmt(n) { return Math.round(n).toLocaleString('en-US').replace(/,/g, '.'); }\n  function ymd(d) {\n    return d.getUTCFullYear() +\n      String(d.getUTCMonth() + 1).padStart(2, '0') +\n      String(d.getUTCDate()).padStart(2, '0');\n  }\n\n  // ── real baseline fetch (relabeled generically as API in the UI) ──\n  async function fetchArticle(article, start, end) {\n    const url = `https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/` +\n      `es.wikipedia/all-access/all-agents/${encodeURIComponent(article)}/daily/${start}/${end}`;\n    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    const json = await res.json();\n    return (json.items || []).map(it => it.views);\n  }\n  async function loadReal() {\n    const end = new Date(); const start = new Date();\n    start.setUTCDate(start.getUTCDate() - (POINTS + 2));\n    const s = ymd(start), e = ymd(end);\n    for (const key of Object.keys(VERTICALS)) {\n      const v = VERTICALS[key];\n      try {\n        const series = await Promise.all(v.articles.map(a => fetchArticle(a, s, e).catch(() => [])));\n        const len = Math.max(...series.map(x => x.length), 0);\n        if (len >= 8) {\n          const merged = [];\n          for (let i = 0; i < len; i++) {\n            merged.push(series.reduce((sum, arr) => sum + (arr[arr.length - len + i] || 0), 0));\n          }\n          v.baseSeries = merged.slice(-POINTS);\n          v.base = v.baseSeries[v.baseSeries.length - 1] || v.base;\n          v.real = true;\n        }\n      } catch (err) { /* keep base */ }\n    }\n  }\n\n  // Build a per-country series from baseline × weight + light deterministic jitter\n  function seriesFor(v, country, salt) {\n    const weight = country.w[v.color] || 1;\n    const baseArr = v.baseSeries && v.baseSeries.length\n      ? v.baseSeries\n      : Array.from({ length: POINTS }, (_, i) => v.base * (0.85 + 0.3 * Math.sin(i / 4)));\n    // pseudo-random but stable per (country,salt) so the curve \"moves\" each rotation\n    let seed = (country.code.charCodeAt(0) + country.code.charCodeAt(1) + salt * 31) % 997;\n    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };\n    return baseArr.map(val => clamp(val * weight * (0.9 + rnd() * 0.2), 1, 1e9));\n  }\n\n  function pathFromHistory(hist, w, h, padTop) {\n    if (!hist.length) return { d: '', tip: [w, h/2] };\n    const mn = Math.min(...hist), mx = Math.max(...hist);\n    const span = Math.max(1, mx - mn);\n    const stepX = w / (hist.length - 1);\n    const points = hist.map((v, i) => [i * stepX, padTop + (h - padTop * 2) * (1 - (v - mn) / span)]);\n    let d = `M ${points[0][0]} ${points[0][1]}`;\n    for (let i = 0; i < points.length - 1; i++) {\n      const p0 = points[i - 1] || points[i], p1 = points[i];\n      const p2 = points[i + 1], p3 = points[i + 2] || p2;\n      const cp1x = p1[0] + (p2[0] - p0[0]) / 6, cp1y = p1[1] + (p2[1] - p0[1]) / 6;\n      const cp2x = p2[0] - (p3[0] - p1[0]) / 6, cp2y = p2[1] - (p3[1] - p1[1]) / 6;\n      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;\n    }\n    return { d, tip: points[points.length - 1] };\n  }\n\n  // Animate counter from prev to next value\n  function animateCounter(el, from, to, dur) {\n    const start = performance.now();\n    function frame(t) {\n      const p = Math.min(1, (t - start) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = fmt(from + (to - from) * eased);\n      if (p < 1) requestAnimationFrame(frame);\n    }\n    requestAnimationFrame(frame);\n  }\n\n  function renderVertical(key, country, salt) {\n    const v = VERTICALS[key];\n    const hist = seriesFor(v, country, salt);\n    const cur = hist[hist.length - 1];\n    const prevWeek = hist[Math.max(0, hist.length - 8)] || cur;\n    const delta = prevWeek ? ((cur - prevWeek) / prevWeek) * 100 : 0;\n\n    const counterEl = liveSlide.querySelector(`[data-counter=\"${key}\"]`);\n    if (counterEl) {\n      const fromVal = parseInt((counterEl.textContent || '0').replace(/\\./g, ''), 10) || 0;\n      counterEl.textContent = fmt(cur);          // guaranteed final value\n      animateCounter(counterEl, fromVal, cur, 700); // RAF enhancement only\n    }\n    const deltaEl = liveSlide.querySelector(`[data-delta=\"${key}\"]`);\n    if (deltaEl) {\n      const sign = delta >= 0 ? '+' : '';\n      deltaEl.textContent = `${sign}${delta.toFixed(1)}% · 7d`;\n      deltaEl.classList.toggle('neg', delta < 0);\n    }\n\n    const { d, tip } = pathFromHistory(hist, 400, 96, 6);\n    const line = liveSlide.querySelector(`[data-line=\"${key}\"]`);\n    const area = liveSlide.querySelector(`[data-area=\"${key}\"]`);\n    const tipEl = liveSlide.querySelector(`[data-tip=\"${key}\"]`);\n    if (line) line.setAttribute('d', d);\n    if (area) area.setAttribute('d', d + ` L ${tip[0]} 96 L 0 96 Z`);\n    if (tipEl) { tipEl.setAttribute('cx', tip[0]); tipEl.setAttribute('cy', tip[1]); }\n\n    // keyword shares wiggle a touch per country\n    let seed = salt * 13 + key.length;\n    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };\n    let total = v.keywords.reduce((s, kw) => s + kw.share, 0);\n    const scale = 100 / total;\n    v.keywords.forEach((kw, i) => {\n      const pct = clamp(kw.share * scale * (0.9 + rnd() * 0.2), 6, 60);\n      const pctEl = liveSlide.querySelector(`[data-kw-pct=\"${key}-${i}\"]`);\n      const barEl = liveSlide.querySelector(`[data-kw-bar=\"${key}-${i}\"]`);\n      if (pctEl) pctEl.textContent = pct.toFixed(0) + '%';\n      if (barEl) barEl.style.width = (pct * 1.8) + '%';\n    });\n\n    // highlight the active country chip\n    const regionEls = liveSlide.querySelectorAll(`[data-regions=\"${key}\"] span`);\n    regionEls.forEach(r => r.classList.toggle('hot', r.textContent === country.code));\n  }\n\n  function rotate() {\n    const country = COUNTRIES[countryIdx % COUNTRIES.length];\n    const salt = countryIdx;\n    Object.keys(VERTICALS).forEach(key => renderVertical(key, country, salt));\n    const cEl = document.getElementById('liveCountry');\n    if (cEl) cEl.textContent = country.name;\n    countryIdx++;\n  }\n\n  function updateBadge() {\n    const badge = document.getElementById('liveSourceBadge');\n    if (!badge) return;\n    const anyReal = Object.values(VERTICALS).some(v => v.real);\n    badge.textContent = anyReal ? 'API · SOFTWARE' : 'API · DEMO';\n  }\n\n  let rotateHandle = null;\n  function start() {\n    if (rotateHandle) return;\n    rotate();                                  // immediate\n    rotateHandle = setInterval(rotate, 2600);  // cycle country every 2.6s\n  }\n  function stop() {\n    if (rotateHandle) { clearInterval(rotateHandle); rotateHandle = null; }\n  }\n\n  async function ensureData() {\n    if (dataLoaded) return;\n    dataLoaded = true;\n    updateBadge();\n    try { await loadReal(); } catch (e) { /* keep base */ }\n    updateBadge();\n  }\n\n  function checkActive() {\n    if (liveSlide.hasAttribute('data-deck-active')) { ensureData(); if (!rotateHandle) start(); }\n    else stop();\n  }\n  setTimeout(checkActive, 200);\n  stage.addEventListener('slidechange', () => setTimeout(checkActive, 60));\n})();\n<\u002Fscript>\n\n<!-- ============== MARKET-SHARE DONUT — participación por país ============== -->\n<script>\n(function() {\n  const slide = document.getElementById('shareSlide');\n  if (!slide) return;\n\n  // Share splits per market (casino / sports / esports) — sum to 100.\n  // Total market size (USD) per market for the center label.\n  const DATA = {\n    LATAM: { casino: 48, sports: 41, esports: 11, total: '$10B', insight: 'Casino lidera, pero apuestas deportivas crece más rápido en la región.' },\n    CO:    { casino: 44, sports: 46, esports: 10, total: '$1.9B', insight: 'Colombia: deportes empata a casino — mercado regulado más maduro (2016).' },\n    MX:    { casino: 53, sports: 35, esports: 12, total: '$2.4B', insight: 'México: casino domina; gran upside en deportes con nueva regulación.' },\n    BR:    { casino: 39, sports: 49, esports: 12, total: '$2.8B', insight: 'Brasil: deportes lidera — fútbol + regulación 2024 disparan la categoría.' },\n    PE:    { casino: 46, sports: 43, esports: 11, total: '$0.7B', insight: 'Perú: equilibrio casino/deportes; regulación 2023 abrió el mercado.' },\n    AR:    { casino: 45, sports: 44, esports: 11, total: '$1.1B', insight: 'Argentina: regulación por provincia; deportes y casino casi parejos.' },\n    EC:    { casino: 47, sports: 42, esports: 11, total: '$0.4B', insight: 'Ecuador: mercado emergente, casino al frente con deportes en alza.' },\n    CL:    { casino: 45, sports: 44, esports: 11, total: '$0.6B', insight: 'Chile: en proceso de regulación; demanda repartida casino/deportes.' }\n  };\n  const NAMES = { LATAM:'LATAM', CO:'Colombia', MX:'México', BR:'Brasil', PE:'Perú', AR:'Argentina', EC:'Ecuador', CL:'Chile' };\n  const CIRC = 2 * Math.PI * 120; // ~754\n\n  const segs = {\n    casino: slide.querySelector('[data-seg=\"casino\"]'),\n    sports: slide.querySelector('[data-seg=\"sports\"]'),\n    esports: slide.querySelector('[data-seg=\"esports\"]')\n  };\n\n  function animatePct(el, to) {\n    const from = parseInt((el.textContent || '0').replace('%',''), 10) || 0;\n    const start = performance.now();\n    function frame(t) {\n      const p = Math.min(1, (t - start) / 700);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = Math.round(from + (to - from) * eased) + '%';\n      if (p < 1) requestAnimationFrame(frame);\n      else el.textContent = to + '%';\n    }\n    requestAnimationFrame(frame);\n  }\n\n  function render(cty) {\n    const d = DATA[cty];\n    if (!d) return;\n    // Donut arcs — cumulative\n    const order = ['casino', 'sports', 'esports'];\n    let offset = 0;\n    order.forEach(k => {\n      const frac = d[k] / 100;\n      const len = frac * CIRC;\n      const seg = segs[k];\n      if (seg) {\n        seg.setAttribute('stroke-dasharray', `${len} ${CIRC - len}`);\n        seg.setAttribute('stroke-dashoffset', `${-offset}`);\n      }\n      offset += len;\n      const pctEl = slide.querySelector(`[data-share=\"${k}\"]`);\n      if (pctEl) { pctEl.textContent = d[k] + '%'; animatePct(pctEl, d[k]); }\n    });\n    const ctyLabel = document.getElementById('shareCtyLabel');\n    const totLabel = document.getElementById('shareTotalLabel');\n    const insight = document.getElementById('shareInsight');\n    if (ctyLabel) ctyLabel.textContent = NAMES[cty];\n    if (totLabel) totLabel.textContent = d.total + ' · total';\n    if (insight) insight.textContent = d.insight;\n  }\n\n  // Button wiring\n  slide.querySelectorAll('.share-cty').forEach(btn => {\n    btn.addEventListener('click', () => {\n      slide.querySelectorAll('.share-cty').forEach(b => b.classList.remove('is-active'));\n      btn.classList.add('is-active');\n      render(btn.dataset.cty);\n    });\n  });\n\n  // Render when slide becomes active (so donut animates in)\n  const stage = document.querySelector('deck-stage');\n  function checkActive() {\n    if (slide.hasAttribute('data-deck-active')) {\n      const active = slide.querySelector('.share-cty.is-active');\n      render(active ? active.dataset.cty : 'LATAM');\n    }\n  }\n  setTimeout(checkActive, 250);\n  if (stage) stage.addEventListener('slidechange', () => setTimeout(checkActive, 80));\n})();\n<\u002Fscript>\n\n<!-- ============== COUNTER-UP ANIMATION ============== -->\n<script>\n(function() {\n  const stage = document.querySelector('deck-stage');\n  if (!stage) return;\n\n  // Init: capture original number tokens for each .num element we can animate\n  function initOne(el) {\n    if (el._cuInit) return;\n    const text = el.textContent.trim();\n    if (!text) return;\n    // Skip ranges or compound (arrows, em-dashes, digit-dash-digit like \"18-35\", or \"$1B → $11B\")\n    if (/[→—–]/.test(text)) return;\n    // Skip if has a dash between two digits (range)\n    if (/\\d\\s*-\\s*\\d/.test(text)) return;\n    // Find first numeric token\n    const m = text.match(/(\\d[\\d,]*\\.?\\d*)/);\n    if (!m) return;\n    const tokStr = m[1];\n    const target = parseFloat(tokStr.replace(/,/g, ''));\n    if (!isFinite(target) || target < 1) return;\n    el._cuInit = true;\n    el._cuTargetStr = tokStr;\n    el._cuTarget = target;\n    el._cuDecimal = tokStr.includes('.');\n    // Snapshot the HTML with the number replaced by 0 so we can update by replace\n    el._cuHTMLTemplate = el.innerHTML;\n    el._cuFmtFn = function(val) {\n      let s;\n      if (el._cuDecimal) s = val.toFixed(1);\n      else if (target >= 1000) s = Math.round(val).toLocaleString('en-US').replace(/,/g, '.');\n      else s = Math.round(val).toString();\n      return s;\n    };\n  }\n\n  function initAll() {\n    document.querySelectorAll('.num').forEach(initOne);\n  }\n\n  function runFor(slide, duration) {\n    if (!slide) return;\n    duration = duration || 1400;\n    slide.querySelectorAll('.num').forEach(el => {\n      if (!el._cuInit) return;\n      const start = performance.now();\n      // Reset to 0 visually at start for clean re-trigger\n      el.innerHTML = el._cuHTMLTemplate.replace(el._cuTargetStr, el._cuFmtFn(0));\n      function frame(t) {\n        const p = Math.min(1, (t - start) / duration);\n        // cubic-bezier(.22,.61,.36,1) approx via easeOutExpo for punchy data feel\n        const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);\n        const val = el._cuTarget * eased;\n        el.innerHTML = el._cuHTMLTemplate.replace(el._cuTargetStr, el._cuFmtFn(val));\n        if (p < 1) requestAnimationFrame(frame);\n        else el.innerHTML = el._cuHTMLTemplate;\n      }\n      requestAnimationFrame(frame);\n    });\n  }\n\n  // Init after a brief delay so DOM + fonts are settled\n  setTimeout(initAll, 80);\n\n  // Trigger on each slidechange\n  stage.addEventListener('slidechange', (e) => {\n    const slide = (e.detail && e.detail.slide) || stage.children[stage.index || 0];\n    runFor(slide);\n  });\n\n  // Trigger for the initial slide once\n  setTimeout(() => {\n    runFor(stage.children[stage.index || 0]);\n  }, 180);\n})();\n<\u002Fscript>\n\n<!-- ============== COLLAPSIBLE CARDS ============== -->\n<script>\n(function() {\n  const stage = document.querySelector('deck-stage');\n  if (!stage) return;\n\n  // Apply collapsible behavior to cards exceeding a text-density threshold.\n  function setupCollapsibles() {\n    document.querySelectorAll('deck-stage > section .card').forEach(card => {\n      if (card._collapsibleProcessed) return;\n      card._collapsibleProcessed = true;\n\n      // Skip cards that contain interactive child controls\n      if (card.querySelector('button, a, input, textarea, select')) return;\n\n      // Skip cards inside cover, dividers and small layouts\n      const section = card.closest('section');\n      if (!section) return;\n      if (section.classList.contains('cover')) return;\n      if (section.classList.contains('section-divider')) return;\n\n      // Threshold: total textContent length AND a minimum scroll height in collapsed pixel coords\n      const txt = (card.textContent || '').trim();\n      const len = txt.length;\n      // Skip stat-only cards (short text) and chip-only cards\n      if (len < 220) return;\n\n      // Measure natural height inside its design-space (parent is scaled). Use bbox in unscaled coordinates.\n      // Since deck is scaled, we use offsetHeight which reflects the unscaled inner height.\n      const natural = card.scrollHeight || card.offsetHeight;\n      if (natural < 240) return;\n\n      card.classList.add('is-collapsible');\n\n      // Hover-to-expand — never conflicts with click navigation\n      let collapseTimer = null;\n      card.addEventListener('mouseenter', () => {\n        clearTimeout(collapseTimer);\n        const target = (card.scrollHeight || natural) + 24;\n        card.style.maxHeight = target + 'px';\n        card.classList.add('is-open');\n      });\n      card.addEventListener('mouseleave', () => {\n        // small delay so brief cursor exits don't snap it shut\n        collapseTimer = setTimeout(() => {\n          card.style.maxHeight = '170px';\n          card.classList.remove('is-open');\n        }, 120);\n      });\n    });\n  }\n\n  // Reset all collapsibles in a slide to closed\n  function resetSlide(slide) {\n    if (!slide) return;\n    slide.querySelectorAll('.card.is-collapsible.is-open').forEach(c => {\n      c.classList.remove('is-open');\n      c.style.maxHeight = '170px';\n    });\n  }\n\n  // Run setup after the deck mounts\n  setTimeout(setupCollapsibles, 240);\n\n  // When changing slides, reset the new slide's collapsibles\n  stage.addEventListener('slidechange', (e) => {\n    const slide = (e.detail && e.detail.slide) || stage.children[stage.index || 0];\n    setTimeout(() => resetSlide(slide), 280);\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fsection><\u002Fbody><\u002Fhtml>"
  </script>
