n  color: var(--ink-100);\n  font-family: var(--font-display);\n  font-feature-settings: \"tnum\";\n  letter-spacing: -0.005em;\n  position: relative;\n  overflow: hidden;\n}\n\n/* ─────────── chrome ─────────── */\n.frame {\n  position: absolute; inset: 0;\n  display: flex; flex-direction: column;\n  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);\n  box-sizing: border-box;\n  z-index: 2;\n}\n.top-rail, .bottom-rail {\n  position: absolute;\n  left: var(--pad-x); right: var(--pad-x);\n  display: flex; align-items: center; justify-content: space-between;\n  font-size: 22px; letter-spacing: 0.28em;\n  text-transform: uppercase; font-weight: 500;\n  color: var(--ink-40); z-index: 3; white-space: nowrap;\n}\n.top-rail { top: 36px; }\n.bottom-rail {\n  bottom: 32px;\n  font-size: 22px; letter-spacing: 0.14em;\n}\n.top-rail .brand { display: flex; align-items: center; gap: 14px; }\n.top-rail .brand .tri {\n  width: 22px; height: 22px;\n  background: linear-gradient(135deg, var(--cyan), var(--violet) 50%, var(--green));\n  clip-path: polygon(50% 4%, 96% 92%, 4% 92%);\n}\n.bottom-rail .src {\n  font-family: var(--font-mono);\n  letter-spacing: 0.02em;\n  text-transform: none;\n  color: var(--ink-40);\n  font-size: var(--t-source);\n}\n.pager { font-family: var(--font-mono); letter-spacing: 0.04em; }\n.pgnum { color: var(--ink-60); font-family: var(--font-mono); }\n\n/* ─────────── eyebrows + headlines ─────────── */\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 14px;\n  font-size: var(--t-eyebrow);\n  letter-spacing: 0.34em;\n  text-transform: uppercase;\n  color: var(--violet);\n  font-weight: 500;\n}\n.eyebrow::before { content: ''; width: 28px; height: 1px; background: currentColor; }\n.eyebrow.green  { color: var(--green); }\n.eyebrow.cyan   { color: var(--cyan); }\n.eyebrow.gold   { color: var(--gold); }\n.eyebrow.rose   { color: var(--rose); }\n\nh1.title, h2.title, .title {\n  font-size: var(--t-title);\n  font-weight: 500;\n  line-height: 1.05;\n  letter-spacing: -0.022em;\n  margin: 0;\n  text-wrap: balance;\n  max-width: 1620px;\n}\n.title .em  { color: var(--green); }\n.title .vio { color: var(--violet); }\n.title .cy  { color: var(--cyan); }\n.title .gld { color: var(--gold); }\n\n.lede {\n  font-size: var(--t-h3);\n  line-height: 1.35;\n  color: var(--ink-80);\n  font-weight: 400;\n  margin: 0;\n  text-wrap: pretty;\n  max-width: 1500px;\n}\n\n/* ─────────── animations ─────────── */\n@keyframes riseIn {\n  from { opacity: 0; transform: translateY(18px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes fadeIn {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\n.stagger > * { opacity: 1; }\n.fade-1, .fade-2 { opacity: 1; }\n\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > * {\n  animation: riseIn 520ms cubic-bezier(.2,.7,.2,1) both;\n}\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(1) { animation-delay: 40ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(2) { animation-delay: 110ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(3) { animation-delay: 180ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(4) { animation-delay: 250ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(5) { animation-delay: 320ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(6) { animation-delay: 390ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(7) { animation-delay: 460ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .stagger > *:nth-child(8) { animation-delay: 530ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .fade-1 { animation: fadeIn 560ms 80ms ease-out both; }\ndeck-stage > section[data-deck-active][data-anim-run] .fade-2 { animation: fadeIn 560ms 220ms ease-out both; }\n\n/* ─────────── primitives ─────────── */\n.divider { height: 1px; background: var(--stroke); width: 100%; }\n.divider-strong { height: 1px; background: var(--stroke-2); width: 100%; }\n\n.tag {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 20px; font-weight: 500;\n  letter-spacing: 0.16em; text-transform: uppercase;\n  color: var(--ink-60);\n  padding: 8px 16px;\n  border: 1px solid var(--stroke-2);\n  border-radius: 999px;\n}\n.tag.green  { color: var(--green);  border-color: rgba(114,255,139,0.30); }\n.tag.violet { color: var(--violet); border-color: rgba(187,170,239,0.30); }\n.tag.cyan   { color: var(--cyan);   border-color: rgba(111,248,255,0.30); }\n.tag.gold   { color: var(--gold);   border-color: rgba(201,168,76,0.30); }\n.tag.rose   { color: var(--rose);   border-color: rgba(255,138,168,0.30); }\n\n.card {\n  background: var(--bg-1);\n  border: 1px solid var(--stroke);\n  border-radius: 4px;\n  padding: 28px;\n  box-sizing: border-box;\n}\n.card .card-head {\n  font-size: 20px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 16px;\n}\n\n/* stat block */\n.stat .num {\n  font-size: 88px; font-weight: 500;\n  line-height: 0.95;\n  letter-spacing: -0.04em;\n  font-feature-settings: \"tnum\";\n}\n.stat .num.green  { color: var(--green); }\n.stat .num.violet { color: var(--violet); }\n.stat .num.cyan   { color: var(--cyan); }\n.stat .num.gold   { color: var(--gold); }\n.stat .sub { font-size: 22px; color: var(--ink-80); margin-top: 16px; line-height: 1.3; }\n.stat .lbl { font-size: 20px; color: var(--ink-60); margin-top: 6px; letter-spacing: 0.02em; line-height: 1.3; }\n\n/* triangles */\n.triangle-mark {\n  background: linear-gradient(180deg, var(--cyan) 0%, var(--violet) 45%, var(--green) 100%);\n  clip-path: polygon(50% 2%, 96% 94%, 4% 94%);\n}\n\n/* source line */\n.source {\n  font-family: var(--font-mono);\n  font-size: var(--t-source);\n  color: var(--ink-40);\n  text-transform: none;\n}\n\n/* tri bullets */\n.tri-bullet {\n  width: 12px; height: 12px;\n  background: var(--green);\n  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);\n  flex-shrink: 0;\n}\n.tri-bullet.violet { background: var(--violet); }\n.tri-bullet.cyan   { background: var(--cyan); }\n.tri-bullet.gold   { background: var(--gold); }\n.tri-bullet.rose   { background: var(--rose); }\n.tri-bullet.ink    { background: var(--ink-60); }\n\nul.tri-list { list-style: none; padding: 0; margin: 0; }\nul.tri-list li {\n  display: flex; gap: 14px; align-items: baseline;\n  padding: 8px 0;\n  font-size: 22px;\n  color: var(--ink-80);\n  line-height: 1.4;\n}\nul.tri-list li .tri-bullet { margin-top: 9px; }\n\n/* tables */\ntable.matrix {\n  width: 100%; border-collapse: collapse;\n  font-size: 22px; color: var(--ink-80);\n}\ntable.matrix thead th {\n  font-size: 18px; font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: 0.20em;\n  color: var(--ink-60);\n  text-align: left;\n  padding: 18px 18px 14px;\n  border-bottom: 1px solid var(--stroke-2);\n}\ntable.matrix tbody td {\n  padding: 18px 18px;\n  border-bottom: 1px solid var(--stroke);\n  vertical-align: top;\n  line-height: 1.4;\n}\ntable.matrix tbody tr:last-child td { border-bottom: none; }\ntable.matrix tbody td:first-child { color: var(--ink-100); font-weight: 500; }\ntable.matrix .seg { display: flex; align-items: center; gap: 14px; }\ntable.matrix .seg-bar { width: 4px; height: 36px; border-radius: 2px; background: var(--green); }\ntable.matrix .seg-bar.violet { background: var(--violet); }\ntable.matrix .seg-bar.cyan   { background: var(--cyan); }\ntable.matrix .seg-bar.gold   { background: var(--gold); }\ntable.matrix .seg-bar.rose   { background: var(--rose); }\ntable.matrix .seg-bar.ink    { background: var(--ink-60); }\n\n.data { font-feature-settings: \"tnum\", \"lnum\"; }\n\n/* ─────────── COVER ─────────── */\n.cover {\n  background:\n    radial-gradient(60% 70% at 80% 30%, rgba(187,170,239,0.10) 0%, transparent 60%),\n    radial-gradient(50% 60% at 12% 80%, rgba(114,255,139,0.08) 0%, transparent 60%),\n    var(--bg-2);\n}\n.cover-grid {\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);\n  background-size: 120px 120px;\n  mask-image: radial-gradient(60% 60% at 50% 50%, #000 30%, transparent 95%);\n}\n.cover .pyramid {\n  position: absolute;\n  right: -40px; top: 50%;\n  transform: translateY(-50%);\n  width: 720px; height: 720px;\n  opacity: 0.85;\n  filter: drop-shadow(0 0 80px rgba(111,248,255,0.20));\n}\n.cover .pyramid img { width: 100%; height: 100%; object-fit: contain; }\n\n/* ─────────── Section divider ─────────── */\n.section-divider { background: var(--bg-2); display: flex; align-items: center; padding: 0 var(--pad-x); }\n.section-divider .big-num {\n  font-size: 380px;\n  font-weight: 300;\n  color: transparent;\n  -webkit-text-stroke: 1.5px var(--ink-40);\n  line-height: 0.85;\n  letter-spacing: -0.06em;\n  font-family: var(--font-display);\n  font-feature-settings: \"tnum\";\n}\n.section-divider .chapter {\n  font-size: 22px; letter-spacing: 0.36em;\n  text-transform: uppercase; color: var(--violet);\n  font-weight: 500; margin-bottom: 32px;\n}\n.section-divider .name {\n  font-size: 96px; font-weight: 400;\n  line-height: 1.0; letter-spacing: -0.025em;\n  max-width: 1100px;\n}\n.section-divider .blurb {\n  font-size: 26px; color: var(--ink-60);\n  line-height: 1.4; margin-top: 36px;\n  max-width: 980px;\n}\n\n/* ─────────── reusable column / row layouts ─────────── */\n.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }\n.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }\n.cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }\n.cols-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }\n\n/* stat strip rule between cols (light dividers) */\n.strip > *:not(:first-child) { border-left: 1px solid var(--stroke); }\n.strip.tb { border-top: 1px solid var(--stroke-2); border-bottom: 1px solid var(--stroke-2); }\n\n/* archetype hero */\n.arch-num {\n  font-size: 220px; font-weight: 400;\n  line-height: 0.85; letter-spacing: -0.05em;\n  color: transparent;\n  -webkit-text-stroke: 1.5px currentColor;\n  font-feature-settings: \"tnum\";\n}\n.arch-side {\n  font-family: var(--font-mono);\n  letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--ink-40); font-size: 18px;\n}\n\n/* keyword chip */\n.kw {\n  display: inline-flex; align-items: center;\n  font-family: var(--font-mono);\n  font-size: 20px; color: var(--ink-80);\n  background: rgba(255,255,255,0.04);\n  border: 1px solid var(--stroke);\n  padding: 8px 14px; border-radius: 2px;\n  letter-spacing: 0;\n  white-space: nowrap;\n}\n\n/* photo triangle clip — for hero treatment */\n.photo-tri {\n  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);\n  background-size: cover; background-position: center;\n}\n\n/* ─────────── Ambient + active-slide animations ─────────── */\n\n/* Ambient — runs forever, very subtle so it doesn't distract */\n@keyframes ambient-drift {\n  0%, 100% { transform: translate(0, 0); opacity: 0.06; }\n  50%      { transform: translate(20px, -16px); opacity: 0.10; }\n}\n@keyframes pyramid-float {\n  0%, 100% { transform: translateY(-50%) translateY(0px); }\n  50%      { transform: translateY(-50%) translateY(-22px); }\n}\n@keyframes pulse-glow {\n  0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 24px rgba(111,248,255,0.20)); }\n  50%      { opacity: 0.85; filter: drop-shadow(0 0 80px rgba(187,170,239,0.35)); }\n}\n@keyframes shimmer {\n  0%   { background-position: -200% 0; }\n  100% { background-position: 200% 0; }\n}\n.cover .pyramid {\n  animation: pyramid-float 8s ease-in-out infinite, pulse-glow 6s ease-in-out infinite;\n}\n\n/* Soft floating triangle particles (cover + section dividers) */\n.ambient-tris {\n  position: absolute; inset: 0;\n  pointer-events: none; z-index: 1;\n  overflow: hidden;\n}\n.ambient-tris .ptri {\n  position: absolute;\n  width: 8px; height: 8px;\n  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);\n  background: var(--ink-40);\n  opacity: 0.18;\n  animation: ambient-drift 12s ease-in-out infinite;\n}\n.ambient-tris .ptri.v { background: var(--violet); animation-duration: 14s; }\n.ambient-tris .ptri.g { background: var(--green);  animation-duration: 16s; }\n.ambient-tris .ptri.c { background: var(--cyan);   animation-duration: 18s; }\n.ambient-tris .ptri.gd{ background: var(--gold);   animation-duration: 13s; }\n\n/* Animated bar fill — width 0 → target var(--w), runs when slide active */\n@keyframes bar-fill {\n  from { width: 0%; }\n  to   { width: var(--w, 50%); }\n}\n.bar-fill > i {\n  display: block;\n  height: 100%;\n  width: 0%;\n  background: var(--bar-color, var(--green));\n  border-radius: 1px;\n}\ndeck-stage > section[data-deck-active] .bar-fill > i {\n  animation: bar-fill 1100ms cubic-bezier(.2,.7,.2,1) 200ms both;\n}\n\n/* Count-up reveal for big numbers — gentle scale-in + glow */\n@keyframes num-pop {\n  0%   { opacity: 0; transform: translateY(12px) scale(0.92); filter: blur(3px); }\n  60%  { opacity: 1; filter: blur(0); }\n  100% { transform: translateY(0) scale(1); }\n}\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop {\n  animation: num-pop 700ms cubic-bezier(.2,.8,.2,1) both;\n}\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(1) { animation-delay: 120ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(2) { animation-delay: 220ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(3) { animation-delay: 320ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(4) { animation-delay: 420ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(5) { animation-delay: 520ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .num-pop:nth-child(6) { animation-delay: 620ms; }\n\n/* SVG path drawing — for USA curve etc */\n@keyframes path-draw {\n  to { stroke-dashoffset: 0; }\n}\ndeck-stage > section[data-deck-active] .path-draw {\n  stroke-dasharray: var(--dl, 1200);\n  stroke-dashoffset: var(--dl, 1200);\n  animation: path-draw 1800ms cubic-bezier(.4,.0,.2,1) 200ms both;\n}\n@keyframes area-fade {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\ndeck-stage > section[data-deck-active] .area-fade {\n  animation: area-fade 1400ms ease 600ms both;\n}\n\n/* DCO flow pulse — dot traveling along the dashed connector */\n@keyframes dco-pulse-move {\n  0%   { offset-distance: 0%; opacity: 0; }\n  10%  { opacity: 1; }\n  90%  { opacity: 1; }\n  100% { offset-distance: 100%; opacity: 0; }\n}\n.dco-pulse {\n  width: 12px; height: 12px;\n  border-radius: 50%;\n  background: var(--cyan);\n  box-shadow: 0 0 24px var(--cyan), 0 0 64px rgba(111,248,255,0.55);\n  position: absolute;\n  top: 38px; left: 0;\n  offset-path: path('M 0 0 L 1620 0');\n  animation: dco-pulse-move 3.6s linear infinite;\n}\n.dco-pulse.b { animation-delay: 1.2s; background: var(--violet); box-shadow: 0 0 24px var(--violet), 0 0 64px rgba(187,170,239,0.55); }\n.dco-pulse.c { animation-delay: 2.4s; background: var(--green); box-shadow: 0 0 24px var(--green), 0 0 64px rgba(114,255,139,0.55); }\n\n/* Triangle decorative loader / shimmer on title accents */\n.shimmer-text {\n  background: linear-gradient(90deg, var(--green) 0%, var(--cyan) 50%, var(--green) 100%);\n  background-size: 200% 100%;\n  background-clip: text;\n  -webkit-background-clip: text;\n  color: transparent;\n  animation: shimmer 4s linear infinite;\n}\n\n/* Grid drift on cover */\n.cover-grid {\n  animation: ambient-drift 22s ease-in-out infinite;\n}\n\n/* Arrow stretch (slide 08 age comparison) */\n@keyframes arrow-grow {\n  from { transform: scaleX(0); transform-origin: left; }\n  to   { transform: scaleX(1); }\n}\ndeck-stage > section[data-deck-active] .arrow-grow {\n  animation: arrow-grow 900ms cubic-bezier(.4,.0,.2,1) 600ms both;\n  transform-origin: left;\n}\n\n/* Roadmap bar fill */\n@keyframes road-fill {\n  from { transform: scaleX(0); transform-origin: left; }\n  to   { transform: scaleX(1); }\n}\ndeck-stage > section[data-deck-active] .road-fill {\n  animation: road-fill 1000ms cubic-bezier(.4,.0,.2,1) both;\n  transform-origin: left;\n}\n\n/* Ring spin for service area numbers and DCO motor */\n@keyframes ring-spin {\n  to { transform: rotate(360deg); }\n}\n.spin-ring {\n  position: absolute;\n  inset: -8px;\n  border-radius: 50%;\n  border: 1px dashed rgba(255,255,255,0.18);\n  animation: ring-spin 28s linear infinite;\n  pointer-events: none;\n}\n\n/* Card hover lift — for interactive feel */\n.card { transition: transform 240ms ease, border-color 240ms ease; }\n.card:hover { transform: translateY(-2px); border-color: var(--stroke-2); }\n\n/* Pulse trail — for connector dots traveling left to right */\n@keyframes pulse-trail {\n  0%   { left: 0;     opacity: 0; transform: scale(0.6); }\n  8%   { opacity: 1;  transform: scale(1); }\n  92%  { opacity: 1;  transform: scale(1); }\n  100% { left: 100%;  opacity: 0; transform: scale(0.6); }\n}\n\n/* DCO step circle ambient ring */\n.dco-step-ring {\n  position: absolute;\n  inset: -10px;\n  border-radius: 50%;\n  border: 1px dashed rgba(255,255,255,0.10);\n  animation: ring-spin 24s linear infinite;\n  pointer-events: none;\n}\n\n/* Roadmap circle outer halo */\n@keyframes halo-pulse {\n  0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }\n  50%      { box-shadow: 0 0 0 6px rgba(255,255,255,0.06); }\n}\n.halo-pulse { animation: halo-pulse 3.6s ease-in-out infinite; }\n\n/* ───────────────────────────────────────────────────────────\n   CONTRAST HARDEN — kill the muddy linear-gradient call-outs\n   strengthen subtle tinted backgrounds for legibility\n   ─────────────────────────────────────────────────────────── */\n/* Solid left-bar accent treatment for call-out blocks (was: linear-gradient muddy) */\ndiv[style*=\"linear-gradient(90deg, rgba(114,255,139,0.06)\"],\ndiv[style*=\"linear-gradient(90deg, rgba(111,248,255,0.06)\"],\ndiv[style*=\"linear-gradient(90deg, rgba(187,170,239,0.06)\"],\ndiv[style*=\"linear-gradient(90deg, rgba(201,168,76,0.06)\"],\ndiv[style*=\"linear-gradient(90deg, rgba(255,138,168,0.06)\"] {\n  background: rgba(255,255,255,0.025) !important;\n  border-radius: 0 4px 4px 0;\n}\n\n/* Boost tinted cards (rose, gold, etc.) to higher contrast */\ndiv[style*=\"background: rgba(255,138,168,0.04)\"] {\n  background: rgba(255,138,168,0.06) !important;\n}\ndiv[style*=\"background: rgba(114,255,139,0.04)\"] {\n  background: rgba(114,255,139,0.05) !important;\n}\ndiv[style*=\"background: rgba(111,248,255,0.04)\"] {\n  background: rgba(111,248,255,0.05) !important;\n}\ndiv[style*=\"background: rgba(187,170,239,0.04)\"] {\n  background: rgba(187,170,239,0.05) !important;\n}\ndiv[style*=\"background: rgba(201,168,76,0.05)\"] {\n  background: rgba(201,168,76,0.06) !important;\n}\n\n/* The 4-stat coloured strips (slides 7 / 13) — ensure full opacity numbers */\n.stat .num.green  { color: #72FF8B; }\n.stat .num.violet { color: #BBAAEF; }\n.stat .num.cyan   { color: #6FF8FF; }\n.stat .num.gold   { color: #C9A84C; }\n\n/* ─────────── MARKET-SHARE DONUT slide ─────────── */\n.share-cty {\n  font-family: var(--font-mono);\n  font-size: 14px;\n  letter-spacing: 0.02em;\n  color: var(--ink-60);\n  background: rgba(255,255,255,0.03);\n  border: 1px solid var(--stroke-2);\n  border-radius: 999px;\n  padding: 8px 16px;\n  cursor: pointer;\n  transition: color 160ms, background 160ms, border-color 160ms;\n}\n.share-cty:hover { color: var(--ink-100); border-color: var(--stroke-hi); background: rgba(255,255,255,0.06); }\n.share-cty.is-active {\n  color: var(--bg-0);\n  background: var(--ink-100);\n  border-color: var(--ink-100);\n  font-weight: 500;\n}\n.share-row { transition: transform 200ms ease, border-color 200ms ease; }\n.share-row:hover { transform: translateX(2px); }\n\n/* ───────────────────────────────────────────────────────────\n   FLAT PASS — remove repeated chrome + background noise\n   ─────────────────────────────────────────────────────────── */\n/* 1 · Hide per-slide brand/label top-rail on CONTENT slides\n   (the global topbar already shows brand + label + pager) */\ndeck-stage > section:not(.cover) .top-rail { display: none; }\n\n/* 2 · Bottom-rail: drop the repeated brand text + pager triangle/number,\n   keep ONLY the discrete source citation, left-aligned */\ndeck-stage > section:not(.cover) .bottom-rail { justify-content: flex-start; }\ndeck-stage > section:not(.cover) .bottom-rail > span:not(.src) { display: none; }\ndeck-stage > section:not(.cover) .bottom-rail .pager { display: none; }\n\n/* 3 · Kill background noise — hero glyphs + ambient particles on content */\n.hero-glyph { display: none !important; }\ndeck-stage > section:not(.cover) .ambient-tris { display: none; }\ndeck-stage > section:not(.cover) .cover-grid { display: none; }\n\n/* 4 · Flatten tinted callouts & cards to near-transparent, single hairline */\ndeck-stage > section:not(.cover) .card {\n  background: rgba(255,255,255,0.018);\n  box-shadow: none;\n}\n.light section .card { background: #FFFFFF; }\n\n/* 5 · Content slides get a clean flat surface (no radial glows) */\ndeck-stage > section:not(.cover):not(.section-divider) {\n  background: var(--bg-2);\n}\n\n/* 6 · Give content frames more breathing room now chrome is gone */\ndeck-stage > section:not(.cover) .frame {\n  padding-top: 72px;\n  padding-bottom: 60px;\n}\n/* ───────────────────────────────────────────────────────────\n   COLLAPSIBLE CARDS — click to reveal long-body cards\n   ─────────────────────────────────────────────────────────── */\n.card.is-collapsible {\n  cursor: pointer;\n  position: relative;\n  max-height: 170px;\n  overflow: hidden;\n  transition: max-height 540ms cubic-bezier(.2,.7,.2,1), border-color 200ms ease, transform 240ms ease;\n}\n.card.is-collapsible::before {\n  content: '';\n  position: absolute;\n  inset: auto 0 0 0;\n  height: 88px;\n  background: linear-gradient(to bottom, transparent, var(--bg-1) 75%);\n  pointer-events: none;\n  transition: opacity 400ms ease;\n  z-index: 1;\n}\n.light .card.is-collapsible::before {\n  background: linear-gradient(to bottom, transparent, #FFFFFF 75%);\n}\n.card.is-collapsible.is-open::before { opacity: 0; }\n.card.is-collapsible::after {\n  content: '';\n  position: absolute;\n  top: 18px; right: 18px;\n  width: 28px; height: 28px;\n  border-radius: 50%;\n  background:\n    radial-gradient(circle, currentColor 2px, transparent 2.5px) center / 100% 100% no-repeat;\n  color: var(--ink-40);\n  border: 1px solid var(--stroke-2);\n  transition: transform 360ms cubic-bezier(.2,.7,.2,1), color 200ms, background 200ms, border-color 200ms;\n  z-index: 2;\n  pointer-events: none;\n  /* magnifier hint dot pattern */\n  box-shadow: inset 0 0 0 0 transparent;\n}\n.card.is-collapsible::after {\n  background:\n    linear-gradient(currentColor, currentColor) center / 11px 1.4px no-repeat;\n  background-color: rgba(255,255,255,0.04);\n}\n.light .card.is-collapsible::after {\n  background:\n    linear-gradient(currentColor, currentColor) center / 11px 1.4px no-repeat,\n    rgba(20,21,42,0.04);\n  border-color: rgba(20,21,42,0.12);\n}\n/* hover-to-expand: chevron rotates as the card opens on hover */\n.card.is-collapsible:hover::after {\n  color: var(--green);\n  border-color: rgba(114,255,139,0.40);\n  background:\n    linear-gradient(currentColor, currentColor) center / 11px 1.4px no-repeat,\n    linear-gradient(currentColor, currentColor) center / 1.4px 11px no-repeat,\n    rgba(114,255,139,0.08);\n}\n.light .card.is-collapsible:hover::after {\n  color: #1F8A5B;\n  border-color: rgba(31,138,91,0.40);\n  background:\n    linear-gradient(currentColor, currentColor) center / 11px 1.4px no-repeat,\n    linear-gradient(currentColor, currentColor) center / 1.4px 11px no-repeat,\n    rgba(31,138,91,0.08);\n}\n.card.is-collapsible:hover {\n  border-color: var(--stroke-hi);\n  cursor: default;\n}\n\n/* ───────────────────────────────────────────────────────────\n   SLIDE TRANSITION — instant swap, NO cross-fade flash\n   Entry motion is delivered per-element via stagger below.\n   ─────────────────────────────────────────────────────────── */\ndeck-stage > section {\n  opacity: 0;\n  pointer-events: none;\n}\ndeck-stage > section[data-deck-active] {\n  opacity: 1;\n  pointer-events: auto;\n}\n\n/* ───────────────────────────────────────────────────────────\n   UNIVERSAL STAGGERED ENTRANCE — every slide, every element\n   slides up from below with a subtle right-to-left drift\n   ─────────────────────────────────────────────────────────── */\n@keyframes elem-enter {\n  from {\n    opacity: 0;\n    transform: translate3d(24px, 18px, 0);\n    filter: blur(2px);\n  }\n  to {\n    opacity: 1;\n    transform: translate3d(0, 0, 0);\n    filter: blur(0);\n  }\n}\ndeck-stage > section[data-deck-active][data-anim-run] .frame > * {\n  animation: elem-enter 760ms cubic-bezier(.22,.61,.36,1) both;\n  will-change: transform, opacity;\n}\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(1)  { animation-delay:  60ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(2)  { animation-delay: 150ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(3)  { animation-delay: 240ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(4)  { animation-delay: 330ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(5)  { animation-delay: 420ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(6)  { animation-delay: 510ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(7)  { animation-delay: 600ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(8)  { animation-delay: 680ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(9)  { animation-delay: 760ms; }\ndeck-stage > section[data-deck-active][data-anim-run] .frame > *:nth-child(10) { animation-delay: 840ms; }\n\n/* Section dividers — large content blocks inside, animate them too */\ndeck-stage > section.section-divider[data-deck-active][data-anim-run] > div > * {\n  animation: elem-enter 800ms cubic-bezier(.22,.61,.36,1) both;\n}\ndeck-stage > section.section-divider[data-deck-active][data-anim-run] > div > *:nth-child(1) { animation-delay:  80ms; }\ndeck-stage > section.section-divider[data-deck-active][data-anim-run] > div > *:nth-child(2) { animation-delay: 220ms; }\n\n/* The legacy .stagger system: replaced by universal — keep keyframes so any\n   in-grid stagger still works, but remove from .frame > .stagger to avoid double-anim */\ndeck-stage > section[data-deck-active][data-anim-run] .frame > .stagger {\n  animation: elem-enter 760ms cubic-bezier(.22,.61,.36,1) both;\n}\ndeck-stage > section[data-deck-active][data-anim-run] .frame > .stagger > * {\n  animation: none;\n}\n\n/* ───────────────────────────────────────────────────────────\n   SECTION DIVIDER — animated count-up effect for big number\n   ─────────────────────────────────────────────────────────── */\n@keyframes section-num-rise {\n  0%   { opacity: 0; transform: translateY(40px); letter-spacing: -0.10em; }\n  60%  { opacity: 1; }\n  100% { opacity: 1; transform: translateY(0); letter-spacing: -0.06em; }\n}\ndeck-stage > section[data-deck-active][data-anim-run] .section-divider .big-num,\ndeck-stage > section.section-divider[data-deck-active][data-anim-run] .big-num {\n  animation: section-num-rise 1100ms cubic-bezier(.2,.7,.2,1) both;\n}\n@keyframes section-pulse-mark {\n  0%, 100% { transform: scale(1); opacity: 1; }\n  50%      { transform: scale(1.35); opacity: 0.7; }\n}\ndeck-stage > section.section-divider[data-deck-active] [style*=\"clip-path: polygon\"] {\n  animation: section-pulse-mark 3.4s ease-in-out infinite;\n  transform-origin: center;\n}\n\n/* ───────────────────────────────────────────────────────────\n   KEYBOARD HINTS OVERLAY\n   ─────────────────────────────────────────────────────────── */\n.kbhint-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(6,6,15,0.78);\n  backdrop-filter: blur(14px);\n  -webkit-backdrop-filter: blur(14px);\n  z-index: 2000;\n  display: none;\n  align-items: center;\n  justify-content: center;\n  font-family: var(--font-display);\n  animation: kbhint-fade 240ms ease both;\n}\n.kbhint-overlay.is-visible { display: flex; }\n@keyframes kbhint-fade {\n  from { opacity: 0; }\n  to { opacity: 1; }\n}\n.kbhint-panel {\n  background: rgba(20,20,36,0.96);\n  border: 1px solid rgba(255,255,255,0.10);\n  border-radius: 10px;\n  padding: 36px 40px;\n  width: 540px;\n  max-width: 92vw;\n  color: var(--ink-80);\n  box-shadow: 0 24px 80px rgba(0,0,0,0.45);\n  animation: kbhint-rise 280ms cubic-bezier(.2,.7,.2,1) both;\n}\n@keyframes kbhint-rise {\n  from { opacity: 0; transform: translateY(12px) scale(0.98); }\n  to { opacity: 1; transform: translateY(0) scale(1); }\n}\n.kbhint-panel h3 {\n  margin: 0 0 8px;\n  font-size: 22px; font-weight: 500;\n  letter-spacing: -0.01em;\n  color: var(--ink-100);\n}\n.kbhint-panel .sub {\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--violet);\n  margin-bottom: 22px;\n  font-weight: 500;\n}\n.kbhint-panel dl {\n  margin: 0;\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: 12px 22px;\n  align-items: center;\n}\n.kbhint-panel dt {\n  display: flex; align-items: center; gap: 8px;\n  justify-content: flex-end;\n}\n.kbhint-panel dt kbd {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  color: var(--ink-100);\n  background: rgba(255,255,255,0.06);\n  border: 1px solid rgba(255,255,255,0.14);\n  border-bottom-width: 2px;\n  border-radius: 4px;\n  padding: 4px 10px;\n  min-width: 28px;\n  text-align: center;\n  letter-spacing: 0.02em;\n}\n.kbhint-panel dd {\n  margin: 0;\n  font-size: 15px;\n  color: var(--ink-80);\n  line-height: 1.4;\n}\n.kbhint-panel .close-hint {\n  margin-top: 22px;\n  font-size: 12px;\n  color: var(--ink-40);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  text-align: center;\n}\n\n/* ───────────────────────────────────────────────────────────\n   NAV MINI-PROGRESS — slide pip strip in sidebar\n   ─────────────────────────────────────────────────────────── */\n.nav-progress {\n  padding: 18px 24px 20px;\n  border-bottom: 1px solid rgba(255,255,255,0.04);\n}\n.nav-progress .lbl {\n  font-size: 10px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--ink-40);\n  margin-bottom: 10px;\n  display: flex; justify-content: space-between;\n}\n.nav-progress .lbl b { color: var(--ink-80); font-weight: 500; font-family: var(--font-mono); }\n.nav-progress .pips {\n  display: grid;\n  grid-template-columns: repeat(36, 1fr);\n  gap: 3px;\n}\n.nav-progress .pip {\n  height: 6px;\n  background: rgba(255,255,255,0.06);\n  border-radius: 1px;\n  transition: background 240ms, transform 240ms;\n  cursor: pointer;\n}\n.nav-progress .pip:hover { background: rgba(255,255,255,0.18); transform: scaleY(1.4); }\n.nav-progress .pip.is-past   { background: var(--ink-40); }\n.nav-progress .pip.is-active { background: var(--violet); box-shadow: 0 0 8px rgba(187,170,239,0.55); }\n\n/* ───────────────────────────────────────────────────────────\n   SIDEBAR SEARCH — `/` shortcut\n   ─────────────────────────────────────────────────────────── */\n.nav-search {\n  padding: 14px 24px 14px;\n  border-bottom: 1px solid rgba(255,255,255,0.04);\n  position: sticky;\n  top: 0;\n  background: rgba(10,10,22,0.96);\n  z-index: 5;\n}\n.nav-search .field {\n  position: relative;\n  display: flex; align-items: center;\n}\n.nav-search input {\n  width: 100%;\n  background: rgba(255,255,255,0.04);\n  border: 1px solid rgba(255,255,255,0.08);\n  border-radius: 6px;\n  padding: 9px 36px 9px 32px;\n  color: var(--ink-100);\n  font-family: var(--font-display);\n  font-size: 13px;\n  letter-spacing: -0.005em;\n  outline: none;\n  transition: border-color 160ms, background 160ms;\n  box-sizing: border-box;\n}\n.nav-search input:focus {\n  border-color: rgba(187,170,239,0.40);\n  background: rgba(255,255,255,0.06);\n}\n.nav-search input::placeholder { color: var(--ink-40); }\n.nav-search .icon {\n  position: absolute;\n  left: 10px; top: 50%; transform: translateY(-50%);\n  width: 14px; height: 14px;\n  color: var(--ink-60);\n  pointer-events: none;\n}\n.nav-search .slash-hint {\n  position: absolute;\n  right: 9px; top: 50%; transform: translateY(-50%);\n  font-family: var(--font-mono); font-size: 10px;\n  padding: 2px 6px;\n  background: rgba(255,255,255,0.06);\n  border: 1px solid rgba(255,255,255,0.10);\n  border-radius: 3px;\n  color: var(--ink-60);\n  pointer-events: none;\n  transition: opacity 140ms;\n}\n.nav-search input:focus + .slash-hint { opacity: 0; }\n.nav-item.is-filtered-out { display: none; }\n.nav-chapter.is-empty { display: none; }\n.nav-chapter.is-empty .nav-chapter-head { display: none; }\n\n/* ───────────────────────────────────────────────────────────\n   LASER POINTER — `L` toggles\n   ─────────────────────────────────────────────────────────── */\nbody.laser-on { cursor: none; }\nbody.laser-on deck-stage, body.laser-on deck-stage * { cursor: none !important; }\n.laser-dot {\n  position: fixed;\n  top: 0; left: 0;\n  width: 22px; height: 22px;\n  margin: -11px 0 0 -11px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(255,138,168,0.95) 0%, rgba(255,80,120,0.65) 35%, rgba(255,40,80,0) 75%);\n  box-shadow: 0 0 24px 6px rgba(255,80,120,0.6), 0 0 48px 16px rgba(255,80,120,0.30);\n  pointer-events: none;\n  z-index: 5000;\n  display: none;\n  mix-blend-mode: screen;\n}\nbody.laser-on .laser-dot { display: block; }\n.laser-trail {\n  position: fixed;\n  top: 0; left: 0;\n  width: 8px; height: 8px;\n  margin: -4px 0 0 -4px;\n  border-radius: 50%;\n  background: rgba(255,138,168,0.55);\n  pointer-events: none;\n  z-index: 4999;\n  display: none;\n}\n\n/* ───────────────────────────────────────────────────────────\n   SPEAKER NOTES — `S` toggles\n   ─────────────────────────────────────────────────────────── */\n.notes-panel {\n  position: fixed;\n  bottom: 0;\n  left: var(--nav-w);\n  right: 0;\n  height: 0;\n  background: rgba(10,10,22,0.96);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  border-top: 1px solid rgba(255,255,255,0.08);\n  color: var(--ink-80);\n  z-index: 998;\n  overflow: hidden;\n  transition: height 360ms cubic-bezier(.2,.7,.2,1), left 360ms cubic-bezier(.4,.0,.2,1);\n  font-family: var(--font-display);\n}\nbody.nav-collapsed .notes-panel { left: 0; }\nbody.notes-open .notes-panel { height: 240px; }\nbody.notes-open.has-app-chrome deck-stage { bottom: 240px; transition: bottom 360ms cubic-bezier(.4,.0,.2,1), left 360ms; }\nbody:not(.notes-open).has-app-chrome deck-stage { bottom: 0; transition: bottom 360ms cubic-bezier(.4,.0,.2,1), left 360ms; }\nbody.focus-mode .notes-panel { transform: translateY(100%); }\n.notes-inner {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  gap: 32px;\n  padding: 24px 32px;\n  height: 100%;\n  box-sizing: border-box;\n}\n.notes-meta {\n  display: flex; flex-direction: column; gap: 8px;\n  min-width: 200px;\n}\n.notes-meta .l-label {\n  font-size: 11px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--violet);\n  font-weight: 500;\n}\n.notes-meta .l-num {\n  font-family: var(--font-mono);\n  font-size: 40px;\n  color: var(--ink-100);\n  font-weight: 400;\n  letter-spacing: -0.02em;\n  line-height: 1;\n}\n.notes-meta .l-title {\n  font-size: 14px;\n  color: var(--ink-60);\n  letter-spacing: -0.005em;\n  line-height: 1.3;\n}\n.notes-body {\n  font-size: 17px;\n  line-height: 1.55;\n  color: var(--ink-80);\n  letter-spacing: -0.005em;\n  overflow-y: auto;\n  padding-right: 12px;\n  max-width: 900px;\n}\n.notes-body::-webkit-scrollbar { width: 6px; }\n.notes-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }\n.notes-body strong { color: var(--green); font-weight: 500; }\n.notes-actions {\n  display: flex; flex-direction: column; gap: 8px;\n  align-items: flex-end;\n  min-width: 120px;\n}\n.notes-actions .row {\n  display: flex; gap: 8px; align-items: center;\n  font-size: 12px;\n  color: var(--ink-60);\n  letter-spacing: 0.02em;\n}\n.notes-actions kbd {\n  font-family: var(--font-mono); font-size: 11px;\n  color: var(--ink-100);\n  background: rgba(255,255,255,0.06);\n  border: 1px solid rgba(255,255,255,0.12);\n  border-bottom-width: 2px;\n  border-radius: 3px;\n  padding: 2px 7px;\n}\n\n/* ───────────────────────────────────────────────────────────\n   EXPORT TOAST — feedback when PNG saved\n   ─────────────────────────────────────────────────────────── */\n.export-toast {\n  position: fixed;\n  top: 76px; right: 24px;\n  background: rgba(20,20,36,0.96);\n  backdrop-filter: blur(14px);\n  border: 1px solid rgba(114,255,139,0.40);\n  color: var(--ink-100);\n  padding: 12px 18px;\n  border-radius: 6px;\n  font-size: 13px;\n  font-family: var(--font-display);\n  letter-spacing: -0.005em;\n  z-index: 3000;\n  display: flex; align-items: center; gap: 10px;\n  transform: translateX(20px);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 280ms ease, transform 280ms ease;\n}\n.export-toast.is-visible {\n  transform: translateX(0);\n  opacity: 1;\n}\n.export-toast .dot {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: var(--green);\n  box-shadow: 0 0 8px var(--green);\n}\n\n/* ───────────────────────────────────────────────────────────\n   LIVE PULSE METRICS — slide 2 \"movimiento del mercado\"\n   ─────────────────────────────────────────────────────────── */\n.live-indicator {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 6px 14px;\n  border: 1px solid rgba(255,138,168,0.40);\n  background: rgba(255,138,168,0.08);\n  border-radius: 999px;\n  font-family: var(--font-mono);\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--rose);\n  font-weight: 500;\n}\n.live-indicator .live-dot {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--rose);\n  box-shadow: 0 0 12px var(--rose);\n  animation: live-blink 1.4s ease-in-out infinite;\n}\n@keyframes live-blink {\n  0%, 100% { opacity: 1; transform: scale(1); }\n  50%      { opacity: 0.35; transform: scale(0.7); }\n}\n\n.live-panel {\n  background: rgba(255,255,255,0.02);\n  border: 1px solid var(--stroke-2);\n  border-top-width: 2px;\n  border-radius: 4px;\n  padding: 26px 30px 24px;\n  display: flex; flex-direction: column;\n  position: relative;\n  overflow: hidden;\n}\n.live-panel.violet { border-top-color: var(--violet); }\n.live-panel.green  { border-top-color: var(--green); }\n.live-panel.cyan   { border-top-color: var(--cyan); }\n.live-panel::before {\n  content: '';\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 1px;\n  background: linear-gradient(90deg, transparent, var(--panel-glow, var(--violet)), transparent);\n  opacity: 0;\n  animation: panel-scan 4s ease-in-out infinite;\n}\n.live-panel.violet { --panel-glow: var(--violet); }\n.live-panel.green  { --panel-glow: var(--green); }\n.live-panel.cyan   { --panel-glow: var(--cyan); }\n@keyframes panel-scan {\n  0%, 100% { opacity: 0; transform: translateX(-100%); }\n  50%      { opacity: 1; transform: translateX(100%); }\n}\n\n.live-panel .pl-head {\n  display: flex; align-items: center; gap: 10px;\n  font-size: 14px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  font-weight: 500;\n  margin-bottom: 18px;\n}\n.live-panel .pl-counter {\n  font-family: var(--font-mono);\n  font-size: 64px;\n  font-weight: 500;\n  line-height: 0.95;\n  letter-spacing: -0.025em;\n  color: var(--ink-100);\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\";\n}\n.live-panel.violet .pl-counter { color: var(--violet); }\n.live-panel.green  .pl-counter { color: var(--green); }\n.live-panel.cyan   .pl-counter { color: var(--cyan); }\n.live-panel .pl-unit {\n  font-size: 14px;\n  color: var(--ink-60);\n  margin-top: 6px;\n  letter-spacing: 0.04em;\n  font-family: var(--font-mono);\n}\n.live-panel .pl-delta {\n  display: inline-flex; align-items: center; gap: 6px;\n  margin-top: 12px;\n  font-family: var(--font-mono);\n  font-size: 14px;\n  color: var(--green);\n  letter-spacing: 0.02em;\n}\n.live-panel .pl-delta.neg { color: var(--rose); }\n.live-panel .pl-delta::before {\n  content: '▲';\n  font-size: 10px;\n}\n.live-panel .pl-delta.neg::before { content: '▼'; }\n\n.live-panel .pl-spark {\n  margin-top: 22px;\n  height: 96px;\n  position: relative;\n}\n.live-panel .pl-spark svg {\n  width: 100%; height: 100%;\n  display: block;\n  overflow: visible;\n}\n.live-panel .pl-spark .pl-area {\n  fill: var(--panel-glow, var(--violet));\n  fill-opacity: 0.14;\n  transition: d 800ms cubic-bezier(.4,0,.2,1);\n}\n.live-panel .pl-spark .pl-line {\n  stroke: var(--panel-glow, var(--violet));\n  stroke-width: 1.8;\n  fill: none;\n  filter: drop-shadow(0 0 6px var(--panel-glow, var(--violet)));\n  transition: d 800ms cubic-bezier(.4,0,.2,1);\n}\n.live-panel .pl-spark .pl-tip {\n  fill: var(--panel-glow, var(--violet));\n  filter: drop-shadow(0 0 8px var(--panel-glow, var(--violet)));\n  transition: cx 800ms cubic-bezier(.4,0,.2,1), cy 800ms cubic-bezier(.4,0,.2,1);\n}\n\n.live-panel .pl-kw {\n  margin-top: 22px;\n  padding-top: 18px;\n  border-top: 1px solid var(--stroke);\n  display: flex; flex-direction: column; gap: 9px;\n}\n.live-panel .pl-kw-head {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.20em;\n  text-transform: uppercase;\n  color: var(--ink-40);\n  margin-bottom: 4px;\n}\n.live-panel .pl-kw-row {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  align-items: center;\n  gap: 12px;\n  font-size: 14px;\n  color: var(--ink-80);\n  letter-spacing: -0.005em;\n  position: relative;\n}\n.live-panel .pl-kw-bar {\n  position: absolute;\n  bottom: -3px; left: 0;\n  height: 2px;\n  background: var(--panel-glow, var(--violet));\n  opacity: 0.6;\n  transition: width 1200ms cubic-bezier(.4,0,.2,1);\n}\n.live-panel .pl-kw-pct {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  color: var(--ink-60);\n  font-variant-numeric: tabular-nums;\n}\n.live-panel .pl-region-strip {\n  margin-top: 16px;\n  display: flex;\n  gap: 6px;\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.10em;\n  color: var(--ink-40);\n}\n.live-panel .pl-region-strip span {\n  padding: 2px 8px;\n  border: 1px solid var(--stroke);\n  border-radius: 3px;\n  background: rgba(255,255,255,0.02);\n}\n.live-panel .pl-region-strip span.hot {\n  border-color: var(--panel-glow, var(--violet));\n  color: var(--ink-100);\n  background: rgba(255,255,255,0.04);\n  animation: region-pulse 2.2s ease-in-out infinite;\n}\n@keyframes region-pulse {\n  0%, 100% { box-shadow: 0 0 0 0 var(--panel-glow, var(--violet)); opacity: 1; }\n  50%      { box-shadow: 0 0 0 4px rgba(255,255,255,0.04); opacity: 0.8; }\n}\n<\u002Fstyle>\n\n<\u002Fhead><body class=\"has-app-chrome\">/* ───────────────────────────────────────────────────────────\n   VISUAL DECLUTTER PASS — quitar peso a chrome redundante\n   ─────────────────────────────────────────────────────────── */\n/* Top-rail: ya hay topbar global con la marca, el repetir en cada slide es ruido */\ndeck-stage &gt; section:not(.cover):not(.section-divider) .top-rail {\n  opacity: 0.32;\n  font-size: 16px;\n  letter-spacing: 0.20em;\n}\ndeck-stage &gt; section:not(.cover):not(.section-divider) .top-rail .brand .tri {\n  opacity: 0.6;\n  width: 16px; height: 16px;\n}\n/* On hover make readable */\ndeck-stage &gt; section:not(.cover):not(.section-divider):hover .top-rail {\n  opacity: 0.55;\n  transition: opacity 240ms ease;\n}\n\n/* Bottom-rail: credibility de citas pero discretas */\n.bottom-rail {\n  font-size: 14px;\n  letter-spacing: 0.12em;\n  opacity: 0.50;\n}\n.bottom-rail .src {\n  font-size: 13px !important;\n  letter-spacing: 0.02em;\n  opacity: 1;\n}\n.bottom-rail .pager {\n  font-size: 13px;\n  letter-spacing: 0.06em;\n}\n/* Cover bottom-rail mantiene presencia */\n.cover .bottom-rail {\n  opacity: 0.80;\n  font-size: 18px;\n  letter-spacing: 0.14em;\n}\n.cover .bottom-rail .pager { font-size: 16px; }\n/* Section divider bottom rail también más discreto */\n.section-divider .bottom-rail { opacity: 0.45; font-size: 14px; }\n\n/* Light theme: source ya leve y oscuro */\n.light .bottom-rail { opacity: 0.55; }\n.light .bottom-rail .src { color: #8E8E9A !important; }\n\n/* ───────────────────────────────────────────────────────────\n   LIGHT THEME — for select slides (rhythm + impact)\n   Apply by adding `light` class to <section>\n   ─────────────────────────────────────────────────────────── */\ndeck-stage &gt; section.light {\n  background: #F5F2EA;\n  color: #14152A;\n}\n.light .top-rail,\n.light .bottom-rail { color: #6E6E80; }\n.light .pgnum { color: #14152A; }\n.light .top-rail .brand { color: #14152A; }\n.light .eyebrow { color: #5A4FCF; }\n.light .eyebrow.green  { color: #1F8A5B; }\n.light .eyebrow.cyan   { color: #0F7C8C; }\n.light .eyebrow.gold   { color: #8C6A1F; }\n.light .eyebrow.rose   { color: #B0364E; }\n.light .title { color: #14152A; }\n.light .title .em  { color: #1F8A5B; }\n.light .title .vio { color: #5A4FCF; }\n.light .title .cy  { color: #0F7C8C; }\n.light .title .gld { color: #8C6A1F; }\n.light .lede { color: #4A4A5C; }\n.light .source { color: #8E8E9A; }\n.light .card {\n  background: #FFFFFF;\n  border-color: rgba(20,21,42,0.08);\n  box-shadow: 0 1px 3px rgba(20,21,42,0.04);\n}\n.light .card .card-head { color: #6E6E80; }\n.light .divider { background: rgba(20,21,42,0.08); }\n.light .divider-strong { background: rgba(20,21,42,0.16); }\n.light .stat .sub { color: #14152A; }\n.light .stat .lbl { color: #6E6E80; }\n.light .strip.tb { border-color: rgba(20,21,42,0.16); }\n.light .strip &gt; *:not(:first-child) { border-left-color: rgba(20,21,42,0.08); }\n.light table.matrix tbody td { border-bottom-color: rgba(20,21,42,0.06); color: #4A4A5C; }\n.light table.matrix tbody td:first-child { color: #14152A; }\n.light table.matrix thead th { border-bottom-color: rgba(20,21,42,0.16); color: #6E6E80; }\n.light .tag { color: #6E6E80; border-color: rgba(20,21,42,0.16); }\n.light .tag.green  { color: #1F8A5B; border-color: rgba(31,138,91,0.30); }\n.light .tag.violet { color: #5A4FCF; border-color: rgba(90,79,207,0.30); }\n.light .tag.cyan   { color: #0F7C8C; border-color: rgba(15,124,140,0.30); }\n.light .tag.gold   { color: #8C6A1F; border-color: rgba(140,106,31,0.30); }\n.light .tag.rose   { color: #B0364E; border-color: rgba(176,54,78,0.30); }\n.light ul.tri-list li { color: #4A4A5C; }\n.light .chapter { color: #5A4FCF; }\n.light .name { color: #14152A; }\n.light .blurb { color: #4A4A5C; }\n.light .big-num { -webkit-text-stroke: 1.5px rgba(20,21,42,0.30); color: transparent; }\n.light .arch-num { color: transparent !important; -webkit-text-stroke: 1.5px currentColor; }\n.light .arch-side { color: #8E8E9A; }\n.light .num.green  { color: #1F8A5B; }\n.light .num.violet { color: #5A4FCF; }\n.light .num.cyan   { color: #0F7C8C; }\n.light .num.gold   { color: #8C6A1F; }\n.light .num.rose   { color: #B0364E; }\n.light .kw { color: #4A4A5C; background: rgba(20,21,42,0.04); border-color: rgba(20,21,42,0.08); }\n.light .triangle-mark { background: linear-gradient(180deg, #0F7C8C 0%, #5A4FCF 45%, #1F8A5B 100%); }\n.light .section-divider { background: #F5F2EA; }\n.light .tri-bullet.ink { background: #6E6E80; }\n\n/* ───────────────────────────────────────────────────────────\n   APP CHROME — sidebar nav, top bar, focus mode\n   ─────────────────────────────────────────────────────────── */\n:root {\n  --nav-w: 360px;\n  --topbar-h: 56px;\n  --app-bg: #06060F;\n}\nhtml, body { background: var(--app-bg); }\nbody.has-app-chrome deck-stage {\n  position: fixed;\n  top: var(--topbar-h);\n  left: var(--nav-w);\n  right: 0;\n  bottom: 0;\n  width: auto !important;\n  height: auto !important;\n  transition: left 360ms cubic-bezier(.4,.0,.2,1);\n}\nbody.nav-collapsed deck-stage {\n  left: 0;\n}\nbody.focus-mode {\n  --topbar-h: 0px;\n  --nav-w: 0px;\n}\nbody.focus-mode .topbar,\nbody.focus-mode .navpanel { transform: translateY(-100%); opacity: 0; pointer-events: none; }\nbody.focus-mode .navpanel { transform: translateX(-100%); }\n\n/* TOP BAR */\n.topbar {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  height: var(--topbar-h);\n  background: rgba(6,6,15,0.92);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  border-bottom: 1px solid rgba(255,255,255,0.06);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 22px 0 24px;\n  z-index: 1000;\n  font-family: var(--font-display);\n  color: var(--ink-80);\n  transition: transform 280ms ease, opacity 280ms ease;\n}\n.topbar .tb-left {\n  display: flex; align-items: center; gap: 18px;\n}\n.topbar .tb-brand {\n  display: flex; align-items: center; gap: 10px;\n  font-size: 14px; font-weight: 500; letter-spacing: 0.02em;\n  color: var(--ink-100);\n}\n.topbar .tb-brand .tri {\n  width: 14px; height: 14px;\n  background: linear-gradient(135deg, var(--cyan), var(--violet) 50%, var(--green));\n  clip-path: polygon(50% 4%, 96% 92%, 4% 92%);\n}\n.topbar .tb-brand .lbl {\n  color: var(--ink-60);\n  font-weight: 400;\n  margin-left: 2px;\n  font-size: 13px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n}\n.topbar .tb-divider {\n  width: 1px; height: 18px;\n  background: rgba(255,255,255,0.10);\n}\n.topbar .tb-title {\n  font-size: 13px;\n  color: var(--ink-60);\n  letter-spacing: 0.02em;\n}\n.topbar .tb-title strong {\n  color: var(--ink-80);\n  font-weight: 500;\n}\n.topbar .tb-right {\n  display: flex; align-items: center; gap: 6px;\n}\n.topbar .tb-pager {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  color: var(--ink-60);\n  padding: 0 14px 0 8px;\n  letter-spacing: 0.04em;\n}\n.topbar .tb-pager b { color: var(--ink-100); font-weight: 500; }\n.tb-btn {\n  display: flex; align-items: center; justify-content: center;\n  width: 32px; height: 32px;\n  background: transparent;\n  border: 1px solid rgba(255,255,255,0.08);\n  border-radius: 6px;\n  cursor: pointer;\n  color: var(--ink-60);\n  transition: background 160ms, border-color 160ms, color 160ms;\n}\n.tb-btn:hover { background: rgba(255,255,255,0.06); color: var(--ink-100); border-color: rgba(255,255,255,0.16); }\n.tb-btn:active { transform: scale(0.96); }\n.tb-btn svg { width: 16px; height: 16px; }\n.tb-btn.tb-toggle.is-collapsed { color: var(--violet); border-color: rgba(187,170,239,0.28); }\n.tb-kbd {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--ink-40);\n  padding: 2px 8px;\n  border: 1px solid rgba(255,255,255,0.08);\n  border-radius: 4px;\n  letter-spacing: 0.02em;\n  margin-left: 8px;\n}\n\n/* PROGRESS bar — fixed to the bottom edge of the viewport (under the slide) */\n.tb-progress {\n  position: fixed;\n  bottom: 0;\n  left: var(--nav-w);\n  right: 0;\n  top: auto;\n  height: 3px;\n  background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--green));\n  transition: width 480ms cubic-bezier(.4,.0,.2,1), left 360ms cubic-bezier(.4,.0,.2,1);\n  width: 0%;\n  z-index: 999;\n  box-shadow: 0 0 16px rgba(187,170,239,0.45);\n}\nbody.nav-collapsed .tb-progress { left: 0; }\nbody.notes-open .tb-progress { bottom: 240px; transition: width 480ms cubic-bezier(.4,.0,.2,1), bottom 360ms cubic-bezier(.4,.0,.2,1), left 360ms; }\n\n/* SIDEBAR NAV */\n.navpanel {\n  position: fixed;\n  top: var(--topbar-h);\n  left: 0;\n  bottom: 0;\n  width: var(--nav-w);\n  background: rgba(10,10,22,0.96);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  border-right: 1px solid rgba(255,255,255,0.06);\n  z-index: 999;\n  overflow-y: auto;\n  overflow-x: hidden;\n  transition: transform 360ms cubic-bezier(.4,.0,.2,1);\n  font-family: var(--font-display);\n  color: var(--ink-80);\n}\nbody.nav-collapsed .navpanel { transform: translateX(-100%); }\n.navpanel::-webkit-scrollbar { width: 6px; }\n.navpanel::-webkit-scrollbar-track { background: transparent; }\n.navpanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }\n.navpanel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }\n.nav-header {\n  padding: 26px 24px 18px;\n  border-bottom: 1px solid rgba(255,255,255,0.04);\n}\n.nav-header .nav-eyebrow {\n  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;\n  color: var(--violet); font-weight: 500;\n}\n.nav-header .nav-title {\n  font-size: 22px; font-weight: 500; line-height: 1.15;\n  margin-top: 10px; color: var(--ink-100); letter-spacing: -0.01em;\n}\n.nav-header .nav-meta {\n  font-family: var(--font-mono); font-size: 11px;\n  color: var(--ink-40); margin-top: 12px; letter-spacing: 0.04em;\n}\n.nav-chapters { padding: 14px 0 32px; }\n.nav-chapter {\n  margin: 0 0 2px;\n}\n.nav-chapter-head {\n  display: flex; align-items: baseline; gap: 10px;\n  padding: 14px 24px 6px;\n  font-size: 10px; letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--ink-40);\n  font-weight: 500;\n}\n.nav-chapter-head .ch-num {\n  font-family: var(--font-mono);\n  color: var(--violet);\n  font-size: 11px;\n}\n.nav-item {\n  display: flex; align-items: center; gap: 12px;\n  padding: 8px 24px 8px 28px;\n  font-size: 13px;\n  color: var(--ink-60);\n  cursor: pointer;\n  border-left: 2px solid transparent;\n  transition: background 140ms, color 140ms, border-color 140ms;\n  text-decoration: none;\n  line-height: 1.3;\n  letter-spacing: -0.005em;\n}\n.nav-item:hover {\n  background: rgba(255,255,255,0.03);\n  color: var(--ink-100);\n}\n.nav-item .ni-num {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--ink-40);\n  width: 26px; flex-shrink: 0;\n  letter-spacing: 0.02em;\n}\n.nav-item .ni-label { flex: 1; }\n.nav-item.is-active {\n  background: linear-gradient(90deg, rgba(187,170,239,0.10), transparent 70%);\n  color: var(--ink-100);\n  border-left-color: var(--violet);\n  font-weight: 500;\n}\n.nav-item.is-active .ni-num { color: var(--violet); }\n.nav-item.is-past .ni-num { color: var(--ink-60); }\n\n/* ARCHETYPE photo slot — circular avatar */\n.arch-photo {\n  --slot-bg: rgba(255,255,255,0.04);\n  width: 220px; height: 220px;\n  border-radius: 50%;\n  overflow: hidden;\n  position: relative;\n  flex-shrink: 0;\n  background: var(--slot-bg);\n  border: 1px solid var(--stroke-2);\n}\n.arch-photo image-slot {\n  width: 100% !important;\n  height: 100% !important;\n  display: block;\n}\n.light .arch-photo {\n  background: rgba(20,21,42,0.04);\n  border-color: rgba(20,21,42,0.10);\n}\n\n/* COVER hero photo strip */\n.cover-photo-strip {\n  position: absolute;\n  bottom: 120px; right: var(--pad-x);\n  width: 520px; height: 280px;\n  z-index: 1;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px;\n}\n.cover-photo-strip .ph {\n  background: rgba(255,255,255,0.04);\n  border: 1px solid var(--stroke);\n  position: relative;\n  overflow: hidden;\n}\n\n/* ─────────── LATAM MAP — pulsing market markers ─────────── */\n.latam-map { width: 100%; height: 100%; display: block; }\n.latam-map .country { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.10); stroke-width: 1; transition: fill 240ms; }\n.latam-map .country.active   { fill: rgba(114,255,139,0.10); stroke: rgba(114,255,139,0.45); }\n.latam-map .country.emerging { fill: rgba(187,170,239,0.08); stroke: rgba(187,170,239,0.35); }\n.latam-map .country.priority { fill: rgba(111,248,255,0.12); stroke: rgba(111,248,255,0.55); stroke-width: 1.5; }\n\n.latam-map .marker-dot { fill: var(--green); filter: drop-shadow(0 0 8px var(--green)); }\n.latam-map .marker-dot.violet { fill: var(--violet); filter: drop-shadow(0 0 8px var(--violet)); }\n.latam-map .marker-dot.cyan   { fill: var(--cyan);   filter: drop-shadow(0 0 8px var(--cyan)); }\n.latam-map .marker-dot.gold   { fill: var(--gold);   filter: drop-shadow(0 0 8px var(--gold)); }\n\n@keyframes marker-pulse {\n  0%   { r: 6;  opacity: 0.7; }\n  100% { r: 30; opacity: 0; }\n}\n.latam-map .marker-ring {\n  fill: none;\n  stroke: var(--green);\n  stroke-width: 1.5;\n  animation: marker-pulse 2.6s ease-out infinite;\n}\n.latam-map .marker-ring.violet { stroke: var(--violet); animation-delay: 0.4s; }\n.latam-map .marker-ring.cyan   { stroke: var(--cyan);   animation-delay: 0.8s; }\n.latam-map .marker-ring.gold   { stroke: var(--gold);   animation-delay: 1.2s; }\n.latam-map .marker-ring.b      { animation-delay: 0.9s; }\n\n.latam-map .map-label {\n  font-family: var(--font-display);\n  font-size: 18px;\n  font-weight: 500;\n  fill: var(--ink-100);\n  letter-spacing: -0.005em;\n}\n.latam-map .map-sublabel {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  fill: var(--ink-60);\n  letter-spacing: 0.04em;\n}\n.latam-map .map-label.faded { fill: var(--ink-40); font-weight: 400; }\n.light .latam-map .country { fill: rgba(20,21,42,0.04); stroke: rgba(20,21,42,0.12); }\n.light .latam-map .map-label { fill: #14152A; }\n.light .latam-map .map-sublabel { fill: #6E6E80; }\n\n/* ─────────── ARCHETYPE AVATAR — geometric SVG portrait ─────────── */\n.arch-avatar {\n  width: 260px; height: 260px;\n  position: relative;\n  flex-shrink: 0;\n  display: flex; align-items: center; justify-content: center;\n}\n.arch-avatar .arch-ring {\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n  border: 1px dashed rgba(255,255,255,0.18);\n  animation: ring-spin 28s linear infinite;\n}\n.arch-avatar .arch-ring-2 {\n  position: absolute;\n  inset: 20px;\n  border-radius: 50%;\n  border: 1px solid var(--avatar-color, var(--violet));\n  opacity: 0.28;\n}\n.arch-avatar .arch-glow {\n  position: absolute;\n  inset: 36px;\n  border-radius: 50%;\n  background: radial-gradient(circle, var(--avatar-color, var(--violet)) 0%, transparent 65%);\n  opacity: 0.10;\n  filter: blur(24px);\n}\n.arch-avatar svg.arch-glyph {\n  position: relative;\n  width: 170px; height: 170px;\n  z-index: 1;\n}\n\n@keyframes glyph-rotate {\n  to { transform: rotate(360deg); }\n}\n.arch-avatar svg.arch-glyph .rotate-slow {\n  animation: glyph-rotate 30s linear infinite;\n  transform-origin: 85px 85px;\n}\n.arch-avatar svg.arch-glyph .rotate-rev {\n  animation: glyph-rotate 22s linear infinite reverse;\n  transform-origin: 85px 85px;\n}\n@keyframes glyph-float {\n  0%, 100% { transform: translateY(0); }\n  50%      { transform: translateY(-3px); }\n}\n.arch-avatar svg.arch-glyph .glyph-float { animation: glyph-float 3.2s ease-in-out infinite; }\n\n.light .arch-avatar .arch-ring { border-color: rgba(20,21,42,0.22); }\n\n/* tiny floating stat chips around the avatar */\n.arch-chip-grid {\n  display: flex; flex-direction: column; gap: 10px;\n  margin-top: 18px;\n  min-width: 240px;\n}\n.arch-chip {\n  display: flex; align-items: baseline; gap: 12px;\n  background: rgba(20,21,42,0.55);\n  border: 1px solid var(--stroke-2);\n  border-radius: 4px;\n  padding: 10px 14px;\n  backdrop-filter: blur(8px);\n}\n.arch-chip .chip-val {\n  font-family: var(--font-mono);\n  font-size: 18px;\n  color: var(--avatar-color, var(--ink-100));\n  font-weight: 500;\n  letter-spacing: 0.02em;\n  min-width: 64px;\n}\n.arch-chip .chip-lbl {\n  font-size: 14px;\n  color: var(--ink-80);\n  letter-spacing: -0.005em;\n}\n.light .arch-chip {\n  background: rgba(255,255,255,0.95);\n  border-color: rgba(20,21,42,0.10);\n}\n.light .arch-chip .chip-lbl { color: #4A4A5C; }\n\n/* ─────────── HERO GLYPHS — vertical intro decoration ─────────── */\n.hero-glyph {\n  position: absolute;\n  top: 120px;\n  right: 72px;\n  width: 440px;\n  height: 440px;\n  opacity: 0.11;\n  pointer-events: none;\n  z-index: 0;\n}\n.hero-glyph svg { width: 100%; height: 100%; display: block; }\n.hero-glyph .spin-slow {\n  animation: ring-spin 60s linear infinite;\n  transform-origin: 120px 120px;\n}\n@keyframes hero-glyph-fade-in {\n  from { opacity: 0; transform: scale(0.94); }\n  to { opacity: 0.11; transform: scale(1); }\n}\ndeck-stage &gt; section[data-deck-active][data-anim-run] .hero-glyph {\n  animation: hero-glyph-fade-in 1100ms cubic-bezier(.2,.7,.2,1) both;\n}\n\n/* ─────────── CHANNEL PICTOGRAMS ─────────── */\n.chan-grid {\n  display: grid;\n  grid-template-columns: repeat(7, 1fr);\n  gap: 14px;\n}\n.chan-tile {\n  display: flex; flex-direction: column; align-items: center; gap: 10px;\n  padding: 18px 12px;\n  border: 1px solid var(--stroke);\n  background: rgba(255,255,255,0.02);\n  border-radius: 4px;\n  text-align: center;\n  transition: border-color 200ms, background 200ms, transform 200ms;\n}\n.chan-tile:hover {\n  border-color: var(--stroke-hi);\n  background: rgba(255,255,255,0.05);\n  transform: translateY(-2px);\n}\n.chan-tile svg { width: 34px; height: 34px; color: var(--cyan); stroke-width: 1.4; }\n.chan-tile .chan-name {\n  font-size: 14px; font-weight: 500;\n  color: var(--ink-100);\n  letter-spacing: -0.005em;\n}\n.chan-tile .chan-sub {\n  font-size: 11px;\n  color: var(--ink-60);\n  font-family: var(--font-mono);\n  letter-spacing: 0.02em;\n}\n.light .chan-tile { background: #FFFFFF; border-color: rgba(20,21,42,0.08); }\n.light .chan-tile svg { color: #0F7C8C; }\n.light .chan-tile .chan-sub { color: #6E6E80; }\n\n/* Print-friendly */\n@media print {\n  .topbar, .navpanel, .tb-progress { display: none !important; }\n  body.has-app-chrome deck-stage { position: static; left: 0; top: 0; }\n}\n\n\n<script type=\"application/json\" id=\"speaker-notes\">[\n  \"Buenas, gracias por el tiempo. En 35 secciones les voy a contar por qué LATAM es el mercado de gambling más interesante de la próxima década y cómo activarlo tecnológicamente — sin pedir permiso a los walled gardens. Toma 18 minutos.\",\n  \"Antes de entrar al contenido completo, el resumen ejecutivo en una página. Cinco cifras y un mapa de cobertura. Si solo se llevan un número de esta presentación, lleven $10B con +18% CAGR. Si se llevan dos, agreguen 77% prefiere digital. El resto del deck explica cómo capturarlo.\",\n  \"Antes de entrar en data histórica, esto es lo que está pasando AHORA mismo: volúmenes de búsqueda LATAM en las tres verticales en tiempo cuasi-real. Casino estable, deportes con picos cada evento mayor, eSports creciendo más rápido en proporción. La señal está ahí — la pregunta es quién la captura primero.\",\n  \"El deck tiene 12 capítulos. Si necesitan saltar, pueden pedirme directo al capítulo. Cada capítulo cubre una decisión: dónde entrar, a quién hablarle, con qué mensaje, en qué canal, con qué KPI y cómo medir.\",\n  \"Tres cifras: $10B en 2025, +18% CAGR sostenido, 8 mercados regulados activos. La pregunta para un CEO ya no es si entrar a LATAM — es a qué velocidad escalar antes que el competidor que está en la pantalla del al lado.\",\n  \"Seis indicadores definen la categoría hoy. Tres de ellos — proyección $8B 2028, +25% e-commerce 2025, 77% prefiere digital — validan que el canal donde pelean es justamente el que Authority puede activar end-to-end.\",\n  \"Tres verticales, cada uno con motivaciones distintas: Casino busca atmósfera, Sports busca intensidad, eSports busca comunidad. Forzar el mismo mensaje a los tres es la falla más común que veo en operadores que entran a LATAM.\",\n  \"Casino LATAM es la categoría motor — pero ya no compite contra otros casinos. Compite contra Netflix, contra restaurantes, contra conciertos. Las marcas que ganan venden experiencia completa, no jackpot.\",\n  \"Pregunta clave para el operador: ¿cómo te ven los consumidores? 89% dice entretenimiento, 90% mejor valor que otros entretenimientos. Si tu mensaje sigue  + sidebar + keyboard)\n    if (typeof stage._onTap === 'function') {\n      stage._onTap = function() { /* no-op — clicks on slide content should never navigate */ };\n    }\n  }\n  patchFit();\n  const ro = new ResizeObserver(() => stage._fit && stage._fit());\n  ro.observe(stage);\n})();\n<\u002Fscript>\n<script>\n(function() {\n  const stage = document.querySelector('deck-stage');\n  if (!stage) return;\n  let animTimer = null;\n  function runAnim(slide) {\n    if (!slide) return;\n    slide.removeAttribute('data-anim-run');\n    void slide.offsetWidth;\n    slide.setAttribute('data-anim-run', '');\n    clearTimeout(animTimer);\n    animTimer = setTimeout(() => slide.removeAttribute('data-anim-run'), 1600);\n  }\n  stage.addEventListener('slidechange', (e) => runAnim(e.detail.slide));\n  function renumber() {\n    const slides = [...stage.children].filter(c => c.tagName === 'SECTION');\n    const total = String(slides.length).padStart(3, '0');\n    slides.forEach((s, i) => {\n      const pg = s.querySelector('.pager');\n      if (pg) pg.textContent = String(i + 1).padStart(3, '0') + ' · ' + total;\n    });\n  }\n  renumber();\n})();\n<\u002Fscript>\n\n<!-- ============== INTERACTIVE NAV LOGIC ============== -->\n<script>\n(function() {\n  const stage = document.querySelector('deck-stage');\n  const navChapters = document.getElementById('navChapters');\n  const navPanel = document.getElementById('navPanel');\n  const navToggle = document.getElementById('navToggle');\n  const prevBtn = document.getElementById('prevBtn');\n  const nextBtn = document.getElementById('nextBtn');\n  const focusBtn = document.getElementById('focusBtn');\n  const tbCurNum = document.getElementById('tbCurNum');\n  const tbTotal = document.getElementById('tbTotal');\n  const tbCurrentLabel = document.getElementById('tbCurrentLabel');\n  const tbProgress = document.getElementById('tbProgress');\n\n  const slides = [...stage.children].filter(c => c.tagName === 'SECTION');\n  const total = slides.length;\n  tbTotal.textContent = String(total).padStart(3, '0');\n\n  // Chapter map — index ranges (0-based) to chapter info\n  const chapters = [\n    { num: '—',  name: 'Introducción',                   color: 'var(--ink-60)', range: [0, 3] },\n    { num: '01', name: 'Contexto LATAM',                color: 'var(--violet)', range: [4, 6] },\n    { num: '02', name: 'Casino — Categoría profunda',   color: 'var(--green)',  range: [7, 12] },\n    { num: '03', name: 'Apuestas Deportivas',           color: 'var(--cyan)',   range: [13, 15] },\n    { num: '04', name: 'eSports & iGaming',             color: 'var(--gold)',   range: [16, 16] },\n    { num: '05', name: 'Audiencias & Arquetipos',       color: 'var(--violet)', range: [17, 23] },\n    { num: '06', name: 'Consumo de medios',             color: 'var(--green)',  range: [24, 26] },\n    { num: '07', name: 'Inventario & canales',          color: 'var(--cyan)',   range: [27, 27] },\n    { num: '08', name: 'Estrategia de activación',      color: 'var(--gold)',   range: [28, 28] },\n    { num: '09', name: 'Tecnología de la plataforma',   color: 'var(--violet)', range: [29, 29] },\n    { num: '10', name: 'Modelo de atribución',          color: 'var(--green)',  range: [30, 30] },\n    { num: '11', name: 'Brand Safety',                  color: 'var(--cyan)',   range: [31, 31] },\n    { num: '12', name: 'Plataforma & próximos pasos',   color: 'var(--gold)',   range: [32, 35] }\n  ];\n\n  // Clean labels for the nav (shorter than data-screen-label)\n  const cleanLabels = [\n    'Cover',\n    'Resumen ejecutivo · datos',\n    'Contenido — 12 capítulos',\n    'Pulso del mercado · LIVE',\n    'Participación de mercado',\n    'La industria no para de crecer', 'Gambling LATAM en números',\n    'Segmentación por vertical', 'Casino — categoría y comportamiento',\n    'Casino vs. entretenimiento', 'La audiencia se rejuvenece',\n    'Loyalty por generación', 'USA · audiencias no activadas',\n    'Vertical · Apuestas Deportivas', 'Demanda + ligas femeninas',\n    'Loyalty gap deportivo',\n    'Vertical · eSports & iGaming',\n    '5 segmentos cualificados',\n    'Capítulo · Arquetipos',\n    'Arquetipo 01 · Casino Gamblers',\n    'Arquetipo 02 · Heavy Casino',\n    'Arquetipo 03 · Regionales',\n    'Arquetipo 04 · Gen Z & Millennials',\n    'Arquetipo 05 · Sports Bettors',\n    'Mapa de consumo de medios',\n    'Cómo llegamos a las audiencias',\n    'Gen Z deep dive',\n    'Inventario omnicanal premium',\n    'Estrategia por vertical',\n    'Inteligencia USA · proyección',\n    'Medición + Raw Pixel Data',\n    'Brand safety stack',\n    'Próximos pasos · roadmap',\n    'DCO · creatividad dinámica',\n    'DCO · keywords por vertical',\n    'Cierre · una pregunta abierta'\n  ];\n\n  // Build chapter nav\n  const ulHTML = chapters.map(ch => {\n    const items = [];\n    for (let i = ch.range[0]; i <= ch.range[1]; i++) {\n      const num = String(i + 1).padStart(2, '0');\n      items.push(`<a class=\"nav-item\" data-idx=\"${i}\" href=\"#\">\n        <span class=\"ni-num\">${num}<\u002Fspan>\n        <span class=\"ni-label\">${cleanLabels[i] || 'Slide ' + (i+1)}<\u002Fspan>\n      <\u002Fa>`);\n    }\n    return `<div class=\"nav-chapter\">\n      <div class=\"nav-chapter-head\"><span class=\"ch-num\" style=\"color: ${ch.color};\">${ch.num}<\u002Fspan><span>${ch.name}<\u002Fspan><\u002Fdiv>\n      ${items.join('')}\n    <\u002Fdiv>`;\n  }).join('');\n  navChapters.innerHTML = ulHTML;\n\n  // Click nav item → go to slide\n  navChapters.addEventListener('click', (e) => {\n    const item = e.target.closest('.nav-item');\n    if (!item) return;\n    e.preventDefault();\n    const idx = parseInt(item.dataset.idx, 10);\n    if (typeof stage.goTo === 'function') stage.goTo(idx);\n    else if (typeof stage.goToIndex === 'function') stage.goToIndex(idx);\n    setTimeout(updateActive, 50);\n  });\n\n  // Update active state from slidechange\n  function updateActive(eventIdx) {\n    const cur = (typeof eventIdx === 'number')\n      ? eventIdx\n      : (typeof stage.index === 'number' ? stage.index : 0);\n    [...navChapters.querySelectorAll('.nav-item')].forEach((el) => {\n      const i = parseInt(el.dataset.idx, 10);\n      el.classList.toggle('is-active', i === cur);\n      el.classList.toggle('is-past', i < cur);\n    });\n    tbCurNum.textContent = String(cur + 1).padStart(3, '0');\n    tbCurrentLabel.textContent = cleanLabels[cur] || '—';\n    tbProgress.style.width = ((cur + 1) / total * 100) + '%';\n\n    // Auto-scroll the active item into view\n    const active = navChapters.querySelector('.nav-item.is-active');\n    if (active) {\n      const r = active.getBoundingClientRect();\n      const pr = navPanel.getBoundingClientRect();\n      if (r.top < pr.top + 80 || r.bottom > pr.bottom - 80) {\n        active.scrollIntoView({ block: 'center', behavior: 'smooth' });\n      }\n    }\n  }\n  stage.addEventListener('slidechange', (e) => {\n    const idx = e && e.detail && typeof e.detail.index === 'number' ? e.detail.index : undefined;\n    updateActive(idx);\n  });\n  // Initial paint\n  setTimeout(updateActive, 60);\n\n  // Toolbar buttons\n  prevBtn.addEventListener('click', () => {\n    if (typeof stage.prev === 'function') stage.prev();\n    else if (typeof stage.previous === 'function') stage.previous();\n  });\n  nextBtn.addEventListener('click', () => {\n    if (typeof stage.next === 'function') stage.next();\n  });\n  function refit() {\n    // wait for transition to settle then refit\n    setTimeout(() => stage._fit && stage._fit(), 380);\n  }\n  navToggle.addEventListener('click', () => {\n    document.body.classList.toggle('nav-collapsed');\n    navToggle.classList.toggle('is-collapsed', document.body.classList.contains('nav-collapsed'));\n    refit();\n  });\n  focusBtn.addEventListener('click', () => {\n    document.body.classList.toggle('focus-mode');\n    refit();\n  });\n  // Help button\n  document.getElementById('helpBtn').addEventListener('click', () => {\n    document.getElementById('kbhintOverlay').classList.toggle('is-visible');\n  });\n  // Notes button\n  document.getElementById('notesBtn').addEventListener('click', () => {\n    document.body.classList.toggle('notes-open');\n    refit();\n  });\n  // Laser button\n  document.getElementById('laserBtn').addEventListener('click', () => {\n    document.body.classList.toggle('laser-on');\n  });\n  // Export PNG button\n  document.getElementById('exportBtn').addEventListener('click', () => exportCurrentSlide());\n\n  // Keyboard shortcuts\n  window.addEventListener('keydown', (e) => {\n    if (e.target.matches('input,textarea,[contenteditable]')) return;\n    if (e.key === 'n' || e.key === 'N') {\n      navToggle.click();\n    } else if (e.key === 'f' || e.key === 'F') {\n      focusBtn.click();\n    } else if (e.key === 's' || e.key === 'S') {\n      document.body.classList.toggle('notes-open');\n      refit();\n    } else if (e.key === 'l' || e.key === 'L') {\n      document.body.classList.toggle('laser-on');\n    } else if (e.key === 'e' || e.key === 'E') {\n      exportCurrentSlide();\n    } else if (e.key === '?' || (e.key === '/' && e.shiftKey) || e.key === 'h' || e.key === 'H') {\n      e.preventDefault();\n      document.getElementById('kbhintOverlay').classList.toggle('is-visible');\n    } else if (e.key === 'Escape') {\n      document.body.classList.remove('focus-mode');\n      document.getElementById('kbhintOverlay').classList.remove('is-visible');\n    }\n  });\n\n  // Close kbhint on backdrop click\n  document.getElementById('kbhintOverlay').addEventListener('click', (e) => {\n    if (e.target === e.currentTarget) e.currentTarget.classList.remove('is-visible');\n  });\n\n  // Nav-progress pip strip — quick jumper\n  (function buildPips() {\n    const pips = document.getElementById('navPips');\n    if (!pips) return;\n    const html = [];\n    for (let i = 0; i < total; i++) {\n      html.push(`<div class=\"pip\" data-idx=\"${i}\" title=\"Slide
